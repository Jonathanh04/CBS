<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CBS Talks Partnership Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Layout: navy brand bar with logo, tab row, one working view at a time; company details open in a side drawer. */
:root {
  --brand: #1b2a53;        /* CBS Talks navy, sampled from the logo */
  --brand-2: #24376b;
  --bg: #f3f4f8;
  --surface: #ffffff;
  --surface-2: #eef0f6;
  --ink: #131a2e;
  --muted: #5b6380;
  --line: #dde1ec;
  --primary: #1b2a53;
  --primary-ink: #ffffff;
  --gold: #e9a93a;
  --soft: #e3e8f5;
  --good: #0ca30c;
  --warn: #fab219;
  --crit: #d03b3b;
  --crit-ink: #b42f2f;
  --q-priority: #1b2a53;
  --q-path: #3d5aa8;
  --q-quick: #138a62;
  --q-low: #8a90a3;
  --bar: #2a78d6;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Source Sans 3", "Helvetica Neue", Arial, sans-serif;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1226; --surface: #141c36; --surface-2: #1b2544; --ink: #eef1f8; --muted: #a6aec7; --line: #2a3558;
    --primary: #e9a93a; --primary-ink: #141c36; --soft: #22305a; --crit-ink: #f08a8a;
    --q-priority: #8fa8ec; --q-path: #6f8ad6; --q-quick: #3cc493; --q-low: #8a90a3; --bar: #3987e5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1226; --surface: #141c36; --surface-2: #1b2544; --ink: #eef1f8; --muted: #a6aec7; --line: #2a3558;
  --primary: #e9a93a; --primary-ink: #141c36; --soft: #22305a; --crit-ink: #f08a8a;
  --q-priority: #8fa8ec; --q-path: #6f8ad6; --q-quick: #3cc493; --q-low: #8a90a3; --bar: #3987e5;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* brand bar */
.brandbar { background: var(--brand); color: #fff; padding-top: env(safe-area-inset-top, 0px); }
.brandbar-inner { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 12px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brandbar img { width: 64px; height: 64px; display: block; border-radius: 4px; }
.brand-title { display: grid; gap: 1px; }
.brand-title h1 { font-size: 1.3rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.02em; }
.brand-title span { font-size: 0.85rem; color: #c9d1ea; }
.brand-right { margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.demo-chip { border: 1px dashed #9fb0dd; color: #dfe5f6; border-radius: 999px; padding: 3px 10px; font-size: 0.78rem; font-weight: 600; }
.btn-ghost-light { background: transparent; border: 1px solid #5a6ea6; color: #fff; border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
.btn-ghost-light:hover { background: var(--brand-2); }

/* tabs */
.tabs { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.tabs-inner { max-width: 1240px; margin: 0 auto; padding-inline: 16px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 12px 12px 10px; cursor: pointer; font-weight: 600; color: var(--muted); white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }
.tab .count { background: var(--soft); color: var(--ink); border-radius: 999px; padding: 0 7px; font-size: 0.75rem; font-weight: 700; }
.tab .count.alert { background: var(--crit); color: #fff; }

main { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 22px 60px; display: grid; gap: 18px; }
.view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.view-head h2 { font-size: 1.55rem; font-weight: 800; }
.view-head p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.section { padding: 16px; display: grid; gap: 10px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.section-head h3 { font-size: 1.02rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.step { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--brand); color: #fff; font-size: 0.78rem; font-family: var(--font-display); }
:root[data-theme="dark"] .step { background: var(--gold); color: var(--brand); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .step { background: var(--gold); color: var(--brand); } }

/* queue rows */
.qrow { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 2fr) auto; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.qrow:first-of-type { border-top: 0; }
.qrow .co { font-weight: 700; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
.qrow .co:hover { text-decoration: underline; }
.qrow .meta { color: var(--muted); font-size: 0.85rem; }
.qrow .actions { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.empty { color: var(--muted); padding: 6px 0; }
@media (max-width: 720px) { .qrow { grid-template-columns: minmax(0, 1fr); gap: 6px; } .qrow .actions { justify-content: flex-start; } }

.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px; font-size: 0.76rem; font-weight: 700; white-space: nowrap; border: 1px solid transparent; }
.pill .ic { font-weight: 800; }
.pill.crit { background: color-mix(in srgb, var(--crit) 14%, transparent); color: var(--crit-ink); }
.pill.warn { background: color-mix(in srgb, var(--warn) 26%, transparent); color: var(--ink); }
.pill.info { background: var(--soft); color: var(--ink); }
.pill.good { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--ink); }
.qpill { display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem; font-weight: 700; border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
.qpill::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: currentColor; }
.qpill.Priority { color: var(--q-priority); background: color-mix(in srgb, var(--q-priority) 12%, transparent); }
.qpill.Build { color: var(--q-path); background: color-mix(in srgb, var(--q-path) 12%, transparent); }
.qpill.Quick { color: var(--q-quick); background: color-mix(in srgb, var(--q-quick) 12%, transparent); }
.qpill.Low, .qpill.Research { color: var(--q-low); background: color-mix(in srgb, var(--q-low) 14%, transparent); }

.btn { border-radius: 8px; padding: 7px 13px; font-weight: 700; font-size: 0.86rem; cursor: pointer; border: 1px solid var(--line); background: var(--surface); }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.btn.primary:hover { filter: brightness(1.12); }
.btn.small { padding: 4px 10px; font-size: 0.8rem; }

/* fit + access mini displays */
.fitbar { display: inline-flex; align-items: center; gap: 8px; }
.fitbar .track { width: 70px; height: 7px; background: var(--soft); border-radius: 4px; overflow: hidden; }
.fitbar .fill { height: 100%; background: var(--brand); border-radius: 4px; }
:root[data-theme="dark"] .fitbar .fill { background: var(--gold); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fitbar .fill { background: var(--gold); } }
.ladder { display: inline-flex; gap: 3px; vertical-align: middle; }
.ladder i { width: 9px; height: 9px; border-radius: 2px; background: var(--soft); }
.ladder i.on { background: var(--q-quick); }

/* matrix */
.matrix { display: grid; grid-template-columns: 34px minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto auto auto; gap: 12px; }
.axis-y { grid-row: 1 / 3; display: flex; align-items: center; justify-content: center; writing-mode: vertical-rl; transform: rotate(180deg); color: var(--muted); font-weight: 700; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; }
.axis-x { grid-column: 2 / 4; display: flex; justify-content: space-between; color: var(--muted); font-weight: 700; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 0 6px; }
.quad { border-radius: var(--radius); padding: 14px; display: grid; gap: 10px; align-content: start; min-height: 190px; border: 1px solid var(--line); background: var(--surface); }
.quad h3 { font-size: 1.05rem; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.quad .rule { color: var(--muted); font-size: 0.82rem; }
.quad.Priority { border-top: 4px solid var(--q-priority); }
.quad.Build { border-top: 4px solid var(--q-path); }
.quad.Quick { border-top: 4px solid var(--q-quick); }
.quad.Low { border-top: 4px solid var(--q-low); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-weight: 600; font-size: 0.88rem; }
.chip:hover { border-color: var(--muted); }
.chip .sc { color: var(--muted); font-weight: 600; font-size: 0.78rem; }
@media (max-width: 720px) { .matrix { grid-template-columns: minmax(0, 1fr); } .axis-y, .axis-x { display: none; } }

/* companies table */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.search { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; min-width: 220px; flex: 1 1 220px; max-width: 360px; }
.filter { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-weight: 600; font-size: 0.84rem; }
.filter[aria-pressed="true"] { background: var(--brand); color: #fff; border-color: var(--brand); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
th { text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--surface-2); }

/* pipeline */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.col { background: var(--surface-2); border-radius: var(--radius); padding: 10px; display: grid; gap: 8px; align-content: start; min-height: 220px; }
.col h3 { font-size: 0.9rem; display: flex; justify-content: space-between; padding: 2px 4px 4px; }
.deal { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 6px; }
.deal .t { font-weight: 700; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
.deal .t:hover { text-decoration: underline; }
.deal select { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 4px 6px; font-size: 0.82rem; }

/* dashboard */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.kpi { padding: 16px; display: grid; gap: 6px; }
.kpi .label { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; }
.kpi .value { font-family: var(--font-display); font-size: 1.7rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.meter { height: 8px; background: var(--soft); border-radius: 4px; overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--gold); border-radius: 4px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 860px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.bars { display: grid; gap: 8px; }
.barrow { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 10px; align-items: center; font-size: 0.88rem; }
.barrow .tr { position: relative; height: 18px; }
.barrow .b { height: 18px; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 2px; }
.barrow .b.zero { background: var(--line); }
.barrow .v { position: absolute; top: 0; line-height: 18px; padding-left: 6px; font-size: 0.8rem; font-weight: 700; }
.list { display: grid; }
.li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.li:first-child { border-top: 0; }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgb(8 12 28 / 0.45); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100%); background: var(--bg); z-index: 50; overflow-y: auto; box-shadow: -12px 0 30px rgb(0 0 0 / 0.18); padding-top: env(safe-area-inset-top, 0px); }
.drawer-head { background: var(--brand); color: #fff; padding: 18px 20px; display: grid; gap: 8px; position: sticky; top: 0; z-index: 2; }
.drawer-head .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.drawer-head h2 { font-size: 1.4rem; font-weight: 800; }
.drawer-head .sub { color: #c9d1ea; font-size: 0.88rem; }
.drawer-head .scores { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
.drawer-head .big { font-family: var(--font-display); font-size: 1.6rem; font-weight: 800; }
.drawer-head .big small { font-size: 0.85rem; font-weight: 600; color: #c9d1ea; }
.drawer-head .qtag { background: #fff; color: var(--brand); border-radius: 6px; padding: 3px 9px; font-weight: 800; font-size: 0.8rem; }
.close { background: transparent; border: 1px solid #5a6ea6; color: #fff; border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 1.1rem; flex: none; }
.drawer-body { padding: 16px; display: grid; gap: 14px; }
.suggest { border-left: 4px solid var(--gold); background: var(--surface); border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; }
.suggest .k { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; }
.fitrow { display: grid; grid-template-columns: 150px auto minmax(0, 1fr); gap: 10px; align-items: start; padding: 9px 0; border-top: 1px solid var(--line); }
.fitrow:first-of-type { border-top: 0; }
.fitrow .name { font-weight: 700; font-size: 0.9rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); width: 30px; height: 28px; cursor: pointer; font-weight: 700; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--brand); color: #fff; }
.seg.locked button { cursor: default; }
.reason { font-size: 0.86rem; }
.src { font-size: 0.78rem; color: var(--muted); }
.warnline { color: var(--crit-ink); font-size: 0.78rem; font-weight: 700; }
@media (max-width: 560px) { .fitrow { grid-template-columns: minmax(0, 1fr) auto; } .fitrow .reason { grid-column: 1 / -1; } }
.access-ladder { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.rung { border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-size: 0.78rem; display: grid; gap: 2px; background: var(--surface); }
.rung b { font-family: var(--font-display); font-size: 1rem; }
.rung.on { background: color-mix(in srgb, var(--q-quick) 14%, var(--surface)); border-color: var(--q-quick); }
.rung.current { outline: 2px solid var(--q-quick); }
@media (max-width: 520px) { .access-ladder { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.label-v, .label-i, .label-u { font-size: 0.7rem; font-weight: 800; border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
.label-v { background: var(--brand); color: #fff; }
.label-i { border: 1px solid var(--brand); color: var(--ink); }
.label-u { border: 1px dashed var(--muted); color: var(--muted); }
:root[data-theme="dark"] .seg button[aria-pressed="true"], :root[data-theme="dark"] .filter[aria-pressed="true"] { background: var(--gold); color: var(--brand); border-color: var(--gold); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button[aria-pressed="true"], :root:not([data-theme="light"]) .filter[aria-pressed="true"] { background: var(--gold); color: var(--brand); border-color: var(--gold); } }
:root[data-theme="dark"] .label-v { background: var(--gold); color: var(--brand); }
:root[data-theme="dark"] .label-i { border-color: var(--gold); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .label-v { background: var(--gold); color: var(--brand); } :root:not([data-theme="light"]) .label-i { border-color: var(--gold); } }
.evi { display: grid; gap: 3px; padding: 9px 0; border-top: 1px solid var(--line); }
.evi:first-child { border-top: 0; }
.evi .top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.evi.inference .stmt { font-style: italic; }
.timeline { display: grid; }
.tl { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 0.88rem; }
.tl:first-child { border-top: 0; }

/* modal + toast */
.modal { position: fixed; inset: 0; display: grid; place-items: center; z-index: 70; padding: 16px; }
.modal .scrim { z-index: 1; }
.modal .box { position: relative; z-index: 2; background: var(--surface); border-radius: 12px; width: min(480px, 100%); padding: 20px; display: grid; gap: 12px; box-shadow: 0 20px 50px rgb(0 0 0 / 0.3); max-height: 90vh; overflow-y: auto; }
.modal h3 { font-size: 1.15rem; }
.field { display: grid; gap: 4px; font-size: 0.85rem; font-weight: 600; }
.field input, .field select, .field textarea { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface); font-weight: 400; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal .btns { display: flex; justify-content: flex-end; gap: 8px; }
.err { color: var(--crit-ink); font-size: 0.85rem; font-weight: 600; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 600; z-index: 80; box-shadow: 0 8px 20px rgb(0 0 0 / 0.25); max-width: calc(100% - 32px); }
footer { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 0 30px; color: var(--muted); font-size: 0.8rem; }
@media (prefers-reduced-motion: no-preference) {
  .drawer { animation: slide 0.18s ease-out; }
  @keyframes slide { from { transform: translateX(24px); opacity: 0.6; } to { transform: none; opacity: 1; } }
  .fitbar .fill, .meter span, .barrow .b { transition: width 0.25s ease; }
}
</style>
</head>
<body>

/* ---------- rules (lean spec §2–§3) ---------- */
const co = id => S.companies.find(c => c.id === id);
const oppsOf = id => S.opps.filter(o => o.co === id);
const isOpen = o => OPEN.includes(o.stage);
const teamActive = n => (TEAM.find(t => t.name === n) || {}).active !== false;

function f4(c) {
  const t = c.commercial.map(e => e.type);
  if (!t.length) return null;
  if (t.includes("Previous CBS Talks spend") || t.includes("Sponsors student organisations")) return 2;
  if (t.some(x => ["Sponsors university activities", "Sponsors similar events", "Previous CBS Talks partner"].includes(x))) return 1;
  return 0;
}
function fit(c) {
  const v = [c.fit.f1[0], c.fit.f2[0], c.fit.f3[0], f4(c), c.fit.f5[0]];
  return v.some(x => x == null) ? null : v.reduce((a, b) => a + b, 0);
}
function access(c) {
  const contacts = c.contacts.filter(p => !p.left && !p.dnc);
  const champ = contacts.find(p => p.rel === "Champion");
  if (champ) return { level: 4, why: `${champ.name} (${champ.title}) is a champion` };
  const sat = oppsOf(c.id).find(o => o.stage === "Won" && o.satisfaction === "Satisfied");
  if (sat) return { level: 4, why: "Satisfied past partner" };
  const warm = S.interactions.filter(i => i.co === c.id && i.outcome === "Positive" && days(i.date, todayIso()) <= SET.warmDays
    && contacts.some(p => p.name === i.contact)).sort((a, b) => b.date.localeCompare(a.date))[0];
  if (warm) return { level: 3, why: `${warm.contact} responded positively on ${fmt(warm.date)}` };
  if (c.intro) return { level: 2, why: c.intro };
  const named = contacts.find(p => !NOT_SUITABLE.includes(p.role));
  if (named) return { level: 1, why: `${named.name}, ${named.title}` };
  return { level: 0, why: "No named contact and no introduction route yet" };
}
function quadrant(c) {
  const f = fit(c), a = access(c).level;
  if (f == null) return "Research";
  if (f >= SET.fitHigh && a >= SET.accessHigh) return "Priority";
  if (f >= SET.fitHigh) return "Build a Path";
  if (a >= SET.accessHigh) return "Quick Win";
  return "Low Priority";
}
const qClass = q => q.split(" ")[0];
function lastContact(id) { const l = S.interactions.filter(i => i.co === id).map(i => i.date).sort().pop(); return l || ""; }
function oppFlag(o) {
  const t = todayIso();
  if (o.stage === "Won" && o.renewalDate && days(t, o.renewalDate) <= SET.renewalDays
    && !S.opps.some(x => x.co === o.co && x.renewal && isOpen(x))) return "Renewal due";
  if (!isOpen(o)) return "";
  if (!o.next || !o.due) return "Missing next action";
  if (days(t, o.due) < 0) return "Overdue";
  if (o.stage === "Contacted") {
    const ints = S.interactions.filter(i => i.co === o.co);
    const sent = ints.filter(i => i.dir === "Sent by us").map(i => i.date).sort().pop();
    const recv = ints.filter(i => i.dir !== "Sent by us").map(i => i.date).sort().pop() || "";
    if (sent && days(sent, t) >= SET.noReplyDays && recv < sent) return "No reply";
  }
  if (days(t, o.due) <= 7) return "Due this week";
  return "";
}
function suggestion(c) {
  if (oppsOf(c.id).some(o => oppFlag(o) === "Renewal due")) {
    const o = oppsOf(c.id).find(o => oppFlag(o) === "Renewal due");
    return o.satisfaction === "Satisfied" ? `Renewal: propose the same package (${o.pkg}) or one level up.` : "Renewal: propose the same package and ask what would make it more valuable.";
  }
  const a = access(c).level, f = f4(c), out = [];
  if (c.fit.f2[0] === 2) out.push("Speaker (cheapest first step)");
  if (c.fit.f3[0] === 2) out.push("Recruitment event or case workshop");
  if (f === 2 && a >= 3) out.push("Sponsorship package");
  if (c.need) out.push(`In-kind / specific need: ${c.need}`);
  if (!out.length) return "Nothing on the cheat sheet fits yet. Don't approach now.";
  const money = a < 3 ? " No cash ask in the first contact (Access below Warm)." : "";
  return out.join(" · ") + "." + money;
}
function checks(c) {
  const out = [];
  if (!teamActive(c.owner)) out.push("Needs new owner");
  ["f1", "f2", "f3", "f5"].forEach(k => { if (c.fit[k][0] === 2 && !c.fit[k][2]) out.push("Source missing for a 2"); });
  if (c.contacts.some(p => days(p.verified, todayIso()) > 183)) out.push("Re-check contact");
  if (c.evidence.some(e => e.ai && !e.checked)) out.push("Unchecked AI evidence");
  if (!c.commercial.length) out.push("Add commercial evidence");
  if (oppsOf(c.id).some(o => o.stage === "Won" && o.satisfaction === "Unknown" && o.end && o.end < todayIso())) out.push("Record satisfaction");
  return [...new Set(out)];
}

/* ---------- work queue (§3.5) ---------- */
function queue() {
  const order = { "Renewal due": 1, "Overdue": 2, "No reply": 3, "Due this week": 4, "Missing next action": 5 };
  const deals = S.opps.map(o => ({ o, flag: oppFlag(o) })).filter(x => x.flag)
    .sort((a, b) => order[a.flag] - order[b.flag] || (a.o.renewalDate || a.o.due || "").localeCompare(b.o.renewalDate || b.o.due || ""));
  const renewals = deals.filter(x => x.flag === "Renewal due");
  const follow = deals.filter(x => x.flag !== "Renewal due");
  const sortFit = (a, b) => fit(b) - fit(a) || access(b).level - access(a).level;
  const prio = S.companies.filter(c => quadrant(c) === "Priority" && !oppsOf(c.id).some(isOpen) && !oppsOf(c.id).some(o => oppFlag(o) === "Renewal due")).sort(sortFit);
  const paths = S.companies.filter(c => c.path).sort((a, b) => a.path.started.localeCompare(b.path.started));
  const quick = S.companies.filter(c => quadrant(c) === "Quick Win" && c.need && !oppsOf(c.id).some(isOpen)).sort(sortFit);
  const room = SET.pathCap - paths.length;
  const cands = room > 0 ? S.companies.filter(c => quadrant(c) === "Build a Path" && !c.path).sort(sortFit).slice(0, room) : [];
  return { renewals, follow, prio, paths, quick, cands };
}

  const by = q => S.companies.filter(c => quadrant(c) === q).sort((a, b) => fit(b) - fit(a) || access(b).level - access(a).level);
  const chip = c => `<button class="chip" data-open="${c.id}">${esc(c.name)} <span class="sc num">Fit ${fit(c) ?? "—"} · A${access(c).level}</span></button>`;
  const quad = (q, rule, extra = "") => `<div class="quad ${qClass(q)}"><h3>${q}<span class="muted small num">${by(q).length}</span></h3><div class="rule">${rule}${extra}</div>
    <div class="chips">${by(q).map(chip).join("") || `<span class="muted small">None</span>`}</div></div>`;
  const paths = S.companies.filter(c => c.path).length;
  const research = by("Research");
  return `
  <div class="view-head"><div><h2>Matrix</h2><p>Fit (0–10) against Access (0–4). High Fit is ${SET.fitHigh}+, high Access is "Introduction available" or better.</p></div></div>
  <div class="matrix">
    <div class="axis-y">Fit → high</div>
    ${quad("Build a Path", "High Fit, low Access. Work on an introduction.", ` <b>${paths} / ${SET.pathCap} paths in progress.</b>`)}
    ${quad("Priority", "High Fit, high Access. Contact now: owner and first contact within 2 weeks.")}
    ${quad("Low Priority", "Low Fit, low Access. No outreach; re-check yearly.")}
    ${quad("Quick Win", "Low Fit, high Access. Only for a specific current need.")}
    <div></div><div class="axis-x" style="grid-column:2/4"><span>← low Access</span><span>high Access →</span></div>
  </div>
  <section class="card section"><div class="section-head"><h3>Research</h3><span class="muted small">not fully rated yet, so outside the matrix</span></div>
  <div class="chips">${research.map(chip).join("") || `<span class="muted small">None</span>`}</div></section>`;
}

/* ---------- Dashboard ---------- */
function viewDashboard() {
  const sem = o => o.closed && o.closed >= SET.semester.start && o.closed <= SET.semester.end;
  const wonSem = S.opps.filter(o => o.stage === "Won" && sem(o));
  const lostSem = S.opps.filter(o => o.stage === "Lost" && sem(o));
  const cashWon = wonSem.filter(o => o.kind === "Cash").reduce((s, o) => s + (o.agreed || 0), 0);
  const proposed = S.opps.filter(o => ["Proposal sent", "Negotiation"].includes(o.stage) && o.kind === "Cash").reduce((s, o) => s + (o.proposed || 0), 0);
  const pct = Math.min(cashWon / SET.semester.target, 1);
  const stageCounts = OPEN.concat(["Nurture"]).map(s => [s, S.opps.filter(o => o.stage === s).length]);
  const maxC = Math.max(1, ...stageCounts.map(x => x[1]));
  const quads = ["Priority", "Build a Path", "Quick Win", "Low Priority", "Research"].map(q => [q, S.companies.filter(c => quadrant(c) === q).length]);
  const health = [
    ["Open deals without a next action", S.opps.filter(o => oppFlag(o) === "Missing next action").length],
    ["Items with an owner who left", S.companies.filter(c => !teamActive(c.owner)).length + S.opps.filter(o => isOpen(o) && !teamActive(o.owner)).length],
    ["Contacts to re-check (> 6 months)", S.companies.flatMap(c => c.contacts).filter(p => days(p.verified, todayIso()) > 183).length],
    ["Unchecked AI evidence", S.companies.flatMap(c => c.evidence).filter(e => e.ai && !e.checked).length],
    ["Won deals missing satisfaction", S.opps.filter(o => o.stage === "Won" && o.satisfaction === "Unknown" && o.end && o.end < todayIso()).length],

      <span class="muted small">${Math.round(pct * 100)}% of the ${dkk(SET.semester.target)} target (placeholder)</span></div>
    <div class="card kpi"><span class="label">Proposed, not committed</span><span class="value">${dkk(proposed)}</span><span class="muted small">cash in Proposal sent + Negotiation</span></div>
    <div class="card kpi"><span class="label">Open deals</span><span class="value num">${S.opps.filter(isOpen).length}</span><span class="muted small">${noncash.filter(isOpen).length} of them non-cash or in-kind</span></div>
    <div class="card kpi"><span class="label">Renewals due</span><span class="value num">${queue().renewals.length}</span><span class="muted small">within ${SET.renewalDays} days</span></div>
  </div>
  <div class="grid2">
    <section class="card section"><div class="section-head"><h3>Open deals by stage</h3></div>
      <div class="bars">${stageCounts.map(([s, n]) => `<div class="barrow"><span>${s}</span><span class="tr"><span class="b ${n ? "" : "zero"}" style="display:block;width:${n / maxC * 85}%"></span><span class="v num" style="left:${n / maxC * 85}%">${n}</span></span></div>`).join("")}</div></section>
    <section class="card section"><div class="section-head"><h3>Companies by quadrant</h3></div>
      <div class="list">${quads.map(([q, n]) => `<div class="li">${qPill(q)}<b class="num">${n}</b></div>`).join("")}</div></section>
    <section class="card section"><div class="section-head"><h3>Won this semester</h3></div>
      <div class="list">${wonSem.map(o => `<div class="li"><span><b>${esc(co(o.co).name)}</b> <span class="muted small">${esc(o.type)} · renewal ${fmt(o.renewalDate)} · ${esc(o.satisfaction)}</span></span><b class="num">${o.kind === "Cash" ? dkk(o.agreed) : esc(o.noncash)}</b></div>`).join("") || `<div class="empty">None yet.</div>`}</div></section>
    <section class="card section"><div class="section-head"><h3>Lost this semester</h3></div>
      <div class="list">${lostSem.map(o => `<div class="li"><span><b>${esc(co(o.co).name)}</b> <span class="muted small">${esc(o.type)}</span></span><span class="pill info">${esc(o.lost)}</span></div>`).join("") || `<div class="empty">None.</div>`}</div>
      ${reasons.length ? `<div class="muted small">Reasons: ${reasons.map(([r, n]) => `${esc(r)} (${n})`).join(" · ")}</div>` : ""}</section>
    <section class="card section"><div class="section-head"><h3>Non-cash and in-kind</h3><span class="muted small">listed, not summed in DKK</span></div>

function closeDrawer() { openCompany = null; document.getElementById("overlay").innerHTML = ""; }

/* ---------- modals ---------- */
function modal(html, onSubmit) {
  const host = document.createElement("div");
  host.className = "modal";
  host.innerHTML = `<div class="scrim" data-mclose></div><form class="box" role="dialog" aria-modal="true">${html}<div class="err" id="m-err" hidden></div>
    <div class="btns"><button type="button" class="btn" data-mclose>Cancel</button><button type="submit" class="btn primary">Save</button></div></form>`;
  document.body.appendChild(host);
  const form = host.querySelector("form");
  const first = form.querySelector("input, select, textarea"); if (first) first.focus();
  host.addEventListener("click", e => { if (e.target.closest("[data-mclose]")) { host.remove(); render(); } });
  form.addEventListener("submit", e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form).entries());
    const err = onSubmit(data);
    if (err) { const el = form.querySelector("#m-err"); el.textContent = err; el.hidden = false; return; }
    host.remove(); render();
  });
}
const opts = (list, sel) => list.map(x => `<option ${x === sel ? "selected" : ""}>${esc(x)}</option>`).join("");

function logContact(oppId) {
  const o = S.opps.find(x => x.id === Number(oppId)); const c = co(o.co);
  modal(`<h3>Log contact · ${esc(c.name)}</h3>
    <div class="field-row"><label class="field">Channel<select name="channel">${opts(["Email", "LinkedIn", "Call", "Meeting", "Event", "Other"], "Email")}</select></label>
    <label class="field">Direction<select name="dir">${opts(["Sent by us", "Received from them", "Two-way"], "Sent by us")}</select></label></div>
    <div class="field-row"><label class="field">Contact<select name="contact">${opts(c.contacts.map(p => p.name), o.contact)}</select></label>
    <label class="field">Outcome<select name="outcome">${opts(["Positive", "Neutral", "Negative", "No reply"], "Positive")}</select></label></div>
    <label class="field">Summary (one line)<input name="summary" maxlength="280" placeholder="What happened?"></label>
    <div class="field-row"><label class="field">Next action<input name="next" value="${esc(o.next || "")}"></label>
    <label class="field">Due<input name="due" type="date" value="${o.due || D(7)}"></label></div>`,
    d => {
      if (!d.summary.trim()) return "Add a one-line summary.";
      if (!d.next.trim()) return "Every open deal needs a next action.";
      const before = quadrant(c);
      S.interactions.push({ date: todayIso(), co: c.id, contact: d.contact, by: o.owner, channel: d.channel, dir: d.dir, summary: d.summary, outcome: d.outcome });
      o.next = d.next; o.due = d.due;
      if (o.stage === "Planned" && d.dir === "Sent by us") o.stage = "Contacted";
      const after = quadrant(c);
      toast(after !== before ? `Logged. ${c.name} moved from ${before} to ${after}.` : `Logged. Next: ${d.next} (${fmt(d.due)}).`);
    });
}

const REQUIRE = {
  "Proposal sent": o => o.kind === "Cash" && !o.pkg && !o.proposed ? ["pkg"] : [],
  "Won": o => [...(o.kind === "Cash" && !o.agreed ? ["agreed"] : []), ...(!o.renewalDate ? ["renewalDate"] : [])],
  "Lost": o => o.lost ? [] : ["lost"],
  "Nurture": o => [...(!o.nurture ? ["nurture"] : []), ...(!o.nurtureUntil ? ["nurtureUntil"] : [])],
};
function moveStage(id, stage) {
  const o = S.opps.find(x => x.id === Number(id)); const c = co(o.co);
  const need = (REQUIRE[stage] || (() => []))(o);
  const apply = () => {
    o.stage = stage;
    if (["Won", "Lost"].includes(stage)) { o.closed = todayIso(); o.next = ""; o.due = ""; }
    if (stage === "Won" && o.kind === "Cash" && !c.commercial.some(e => e.type === "Previous CBS Talks spend" && e.year === String(TODAY.getFullYear())))
      c.commercial.push({ type: "Previous CBS Talks spend", desc: `${o.type} agreed this semester`, amount: o.agreed, year: String(TODAY.getFullYear()) });
    if (stage === "Won" && !o.satisfaction) o.satisfaction = "Unknown";
    if (stage === "Nurture") { o.next = "Revisit"; o.due = o.nurtureUntil; }
    toast(`${c.name} moved to ${stage}.`);
  };
  if (!need.length) { apply(); render(); return; }
  const fields = {
    pkg: `<label class="field">Package<select name="pkg">${opts(PACKAGES.map(p => p.name), "Standard package")}</select></label>`,
    agreed: `<label class="field">Agreed value (DKK)<input name="agreed" type="number" min="0" step="500" value="${o.proposed || ""}"></label>`,
    renewalDate: `<label class="field">Renewal date<input name="renewalDate" type="date" value="${D(300)}"></label>`,
    lost: `<label class="field">Lost reason<select name="lost">${opts(LOST_REASONS, "No budget")}</select></label>`,
    nurture: `<label class="field">Why nurture?<input name="nurture" placeholder="e.g. budget decided in spring"></label>`,
    nurtureUntil: `<label class="field">Revisit on<input name="nurtureUntil" type="date" value="${D(90)}"></label>`,
  };
  modal(`<h3>Move ${esc(c.name)} to ${esc(stage)}</h3><p class="muted small" style="margin:0">This stage requires:</p>${need.map(k => fields[k]).join("")}`, d => {
    if (need.includes("agreed") && !(Number(d.agreed) > 0)) return "Enter the agreed value.";
    if (need.includes("nurture") && !d.nurture.trim()) return "Say why this is parked.";
    if (d.pkg) { o.pkg = d.pkg; o.proposed = PACKAGES.find(p => p.name === d.pkg).price; }
    if (d.agreed) o.agreed = Number(d.agreed);
    ["renewalDate", "lost", "nurture", "nurtureUntil"].forEach(k => { if (d[k]) o[k] = d[k]; });
    apply();
  });
}
function newDeal(companyId) {
  const options = S.companies.filter(c => quadrant(c) !== "Research");
  modal(`<h3>New deal</h3>
    <label class="field">Company<select name="co">${options.map(c => `<option value="${c.id}" ${c.id === companyId ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select></label>
    <div class="field-row"><label class="field">Partnership type<select name="type">${opts(["Speaker", "Recruitment", "Event sponsor", "Recurring sponsor", "Annual partner", "Knowledge", "Content", "Networking", "In-kind"], "Speaker")}</select></label>
    <label class="field">Value kind<select name="kind">${opts(["Cash", "In-kind", "Non-cash"], "Non-cash")}</select></label></div>
    <label class="field">Owner<select name="owner">${opts(TEAM.filter(t => t.active).map(t => t.name), "A.K.")}</select></label>
    <div class="field-row"><label class="field">Next action<input name="next" placeholder="e.g. Ask for an introduction"></label>
    <label class="field">Due<input name="due" type="date" value="${D(7)}"></label></div>`, d => {
      if (!d.next.trim()) return "A planned deal needs a next action.";
      const c = co(d.co);
      S.opps.push({ id: nextOppId++, co: d.co, type: d.type, stage: "Planned", owner: d.owner, contact: (c.contacts[0] || {}).name || "", kind: d.kind, noncash: d.kind !== "Cash" ? d.type : "", next: d.next, due: d.due });
      toast(`Deal planned with ${c.name}.`);
    });
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 3200); }

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target;
  const tab = t.closest("[data-tab]"); if (tab) { current = tab.dataset.tab; try { localStorage.setItem("cbs-desk-tab", current); } catch (x) {} render(); window.scrollTo(0, 0); return; }
  if (t.closest("[data-close]")) { closeDrawer(); return; }
  const lg = t.closest("[data-log]"); if (lg) { logContact(lg.dataset.log); return; }
  const nd = t.closest("[data-newdeal]"); if (nd) { newDeal(nd.dataset.newdeal); return; }
  if (t.closest("#new-deal")) { newDeal(); return; }
  const rate = t.closest("[data-rate]");
  if (rate) { const c = co(openCompany); const before = quadrant(c); c.fit[rate.dataset.rate][0] = Number(rate.dataset.val);
    const after = quadrant(c); render(); if (after !== before) toast(`${c.name} moved from ${before} to ${after}.`); return; }
  const fl = t.closest("[data-filter]"); if (fl) { companyFilter = fl.dataset.filter; render(); return; }
  const op = t.closest("[data-open]"); if (op) { openCompany = op.dataset.open; renderDrawer(); const b = document.querySelector(".drawer .close"); if (b) b.focus(); return; }
  if (t.closest("#reset")) { S = seed(); closeDrawer(); render(); toast("Demo reset to the example data."); }
});
document.addEventListener("change", e => { const m = e.target.closest("[data-move]"); if (m) moveStage(m.dataset.move, m.value); });
document.addEventListener("input", e => { if (e.target.id === "search") { companySearch = e.target.value; const pos = e.target.selectionStart; render(); const s = document.getElementById("search"); s.focus(); s.setSelectionRange(pos, pos); } });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { const m = document.querySelector(".modal"); if (m) { m.remove(); render(); return; } if (openCompany) closeDrawer(); }
  if (e.key === "Enter" && e.target.matches("tr[data-open]")) { openCompany = e.target.dataset.open; renderDrawer(); }
});
render();
</script>
</body>
</html>
