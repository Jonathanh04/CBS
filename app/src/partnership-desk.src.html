<title>CBS Talks Partnership Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Partnership Desk (live). Source for app/partnership-desk.html: rebuild with python3 tools/build_app.py. */
/* Layout: navy brand bar with logo, tab row, one working view at a time; company details open in a side drawer. */
:root {
  --brand: #1b2a53;        /* CBS Talks navy, sampled from the logo */
  --brand-2: #24376b;
  --bg: #f3f4f8;
  --surface: #ffffff;
  --surface-2: #eef0f6;
  --ink: #131a2e;
  --muted: #5b6380;
  --line: #dde1ec;
  --primary: #1b2a53;
  --primary-ink: #ffffff;
  --gold: #e9a93a;
  --soft: #e3e8f5;
  --good: #0ca30c;
  --warn: #fab219;
  --crit: #d03b3b;
  --crit-ink: #b42f2f;
  --q-priority: #1b2a53;
  --q-path: #3d5aa8;
  --q-quick: #138a62;
  --q-low: #8a90a3;
  --bar: #2a78d6;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Source Sans 3", "Helvetica Neue", Arial, sans-serif;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1226; --surface: #141c36; --surface-2: #1b2544; --ink: #eef1f8; --muted: #a6aec7; --line: #2a3558;
    --primary: #e9a93a; --primary-ink: #141c36; --soft: #22305a; --crit-ink: #f08a8a;
    --q-priority: #8fa8ec; --q-path: #6f8ad6; --q-quick: #3cc493; --q-low: #8a90a3; --bar: #3987e5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1226; --surface: #141c36; --surface-2: #1b2544; --ink: #eef1f8; --muted: #a6aec7; --line: #2a3558;
  --primary: #e9a93a; --primary-ink: #141c36; --soft: #22305a; --crit-ink: #f08a8a;
  --q-priority: #8fa8ec; --q-path: #6f8ad6; --q-quick: #3cc493; --q-low: #8a90a3; --bar: #3987e5;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* brand bar */
.brandbar { background: var(--brand); color: #fff; padding-top: env(safe-area-inset-top, 0px); }
.brandbar-inner { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 12px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brandbar img { width: 64px; height: 64px; display: block; border-radius: 4px; }
.brand-title { display: grid; gap: 1px; }
.brand-title h1 { font-size: 1.3rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.02em; }
.brand-title span { font-size: 0.85rem; color: #c9d1ea; }
.brand-right { margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.demo-chip { border: 1px dashed #9fb0dd; color: #dfe5f6; border-radius: 999px; padding: 3px 10px; font-size: 0.78rem; font-weight: 600; }
.btn-ghost-light { background: transparent; border: 1px solid #5a6ea6; color: #fff; border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
.btn-ghost-light:hover { background: var(--brand-2); }

/* tabs */
.tabs { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.tabs-inner { max-width: 1240px; margin: 0 auto; padding-inline: 16px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 12px 12px 10px; cursor: pointer; font-weight: 600; color: var(--muted); white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }
.tab .count { background: var(--soft); color: var(--ink); border-radius: 999px; padding: 0 7px; font-size: 0.75rem; font-weight: 700; }
.tab .count.alert { background: var(--crit); color: #fff; }

main { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 22px 60px; display: grid; gap: 18px; }
.view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.view-head h2 { font-size: 1.55rem; font-weight: 800; }
.view-head p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.section { padding: 16px; display: grid; gap: 10px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.section-head h3 { font-size: 1.02rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.step { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--brand); color: #fff; font-size: 0.78rem; font-family: var(--font-display); }
:root[data-theme="dark"] .step { background: var(--gold); color: var(--brand); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .step { background: var(--gold); color: var(--brand); } }

/* queue rows */
.qrow { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 2fr) auto; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.qrow:first-of-type { border-top: 0; }
.qrow .co { font-weight: 700; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
.qrow .co:hover { text-decoration: underline; }
.qrow .meta { color: var(--muted); font-size: 0.85rem; }
.qrow .actions { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.empty { color: var(--muted); padding: 6px 0; }
@media (max-width: 720px) { .qrow { grid-template-columns: minmax(0, 1fr); gap: 6px; } .qrow .actions { justify-content: flex-start; } }

.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px; font-size: 0.76rem; font-weight: 700; white-space: nowrap; border: 1px solid transparent; }
.pill .ic { font-weight: 800; }
.pill.crit { background: color-mix(in srgb, var(--crit) 14%, transparent); color: var(--crit-ink); }
.pill.warn { background: color-mix(in srgb, var(--warn) 26%, transparent); color: var(--ink); }
.pill.info { background: var(--soft); color: var(--ink); }
.pill.good { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--ink); }
.qpill { display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem; font-weight: 700; border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
.qpill::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: currentColor; }
.qpill.Priority { color: var(--q-priority); background: color-mix(in srgb, var(--q-priority) 12%, transparent); }
.qpill.Build { color: var(--q-path); background: color-mix(in srgb, var(--q-path) 12%, transparent); }
.qpill.Quick { color: var(--q-quick); background: color-mix(in srgb, var(--q-quick) 12%, transparent); }
.qpill.Low, .qpill.Research { color: var(--q-low); background: color-mix(in srgb, var(--q-low) 14%, transparent); }

.btn { border-radius: 8px; padding: 7px 13px; font-weight: 700; font-size: 0.86rem; cursor: pointer; border: 1px solid var(--line); background: var(--surface); }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.btn.primary:hover { filter: brightness(1.12); }
.btn.small { padding: 4px 10px; font-size: 0.8rem; }

/* fit + access mini displays */
.fitbar { display: inline-flex; align-items: center; gap: 8px; }
.fitbar .track { width: 70px; height: 7px; background: var(--soft); border-radius: 4px; overflow: hidden; }
.fitbar .fill { height: 100%; background: var(--brand); border-radius: 4px; }
:root[data-theme="dark"] .fitbar .fill { background: var(--gold); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fitbar .fill { background: var(--gold); } }
.ladder { display: inline-flex; gap: 3px; vertical-align: middle; }
.ladder i { width: 9px; height: 9px; border-radius: 2px; background: var(--soft); }
.ladder i.on { background: var(--q-quick); }

/* matrix */
.matrix { display: grid; grid-template-columns: 34px minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto auto auto; gap: 12px; }
.axis-y { grid-row: 1 / 3; display: flex; align-items: center; justify-content: center; writing-mode: vertical-rl; transform: rotate(180deg); color: var(--muted); font-weight: 700; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; }
.axis-x { grid-column: 2 / 4; display: flex; justify-content: space-between; color: var(--muted); font-weight: 700; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 0 6px; }
.quad { border-radius: var(--radius); padding: 14px; display: grid; gap: 10px; align-content: start; min-height: 190px; border: 1px solid var(--line); background: var(--surface); }
.quad h3 { font-size: 1.05rem; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.quad .rule { color: var(--muted); font-size: 0.82rem; }
.quad.Priority { border-top: 4px solid var(--q-priority); }
.quad.Build { border-top: 4px solid var(--q-path); }
.quad.Quick { border-top: 4px solid var(--q-quick); }
.quad.Low { border-top: 4px solid var(--q-low); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-weight: 600; font-size: 0.88rem; }
.chip:hover { border-color: var(--muted); }
.chip .sc { color: var(--muted); font-weight: 600; font-size: 0.78rem; }
@media (max-width: 720px) { .matrix { grid-template-columns: minmax(0, 1fr); } .axis-y, .axis-x { display: none; } }

/* companies table */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.search { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; min-width: 220px; flex: 1 1 220px; max-width: 360px; }
.filter { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-weight: 600; font-size: 0.84rem; }
.filter[aria-pressed="true"] { background: var(--brand); color: #fff; border-color: var(--brand); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
th { text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--surface-2); }

/* pipeline */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.col { background: var(--surface-2); border-radius: var(--radius); padding: 10px; display: grid; gap: 8px; align-content: start; min-height: 220px; }
.col h3 { font-size: 0.9rem; display: flex; justify-content: space-between; padding: 2px 4px 4px; }
.deal { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 6px; }
.deal .t { font-weight: 700; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
.deal .t:hover { text-decoration: underline; }
.deal select { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 4px 6px; font-size: 0.82rem; }

/* dashboard */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.kpi { padding: 16px; display: grid; gap: 6px; }
.kpi .label { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; }
.kpi .value { font-family: var(--font-display); font-size: 1.7rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.meter { height: 8px; background: var(--soft); border-radius: 4px; overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--gold); border-radius: 4px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 860px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.bars { display: grid; gap: 8px; }
.barrow { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 10px; align-items: center; font-size: 0.88rem; }
.barrow .tr { position: relative; height: 18px; }
.barrow .b { height: 18px; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 2px; }
.barrow .b.zero { background: var(--line); }
.barrow .v { position: absolute; top: 0; line-height: 18px; padding-left: 6px; font-size: 0.8rem; font-weight: 700; }
.list { display: grid; }
.li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.li:first-child { border-top: 0; }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgb(8 12 28 / 0.45); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100%); background: var(--bg); z-index: 50; overflow-y: auto; box-shadow: -12px 0 30px rgb(0 0 0 / 0.18); padding-top: env(safe-area-inset-top, 0px); }
.drawer-head { background: var(--brand); color: #fff; padding: 18px 20px; display: grid; gap: 8px; position: sticky; top: 0; z-index: 2; }
.drawer-head .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.drawer-head h2 { font-size: 1.4rem; font-weight: 800; }
.drawer-head .sub { color: #c9d1ea; font-size: 0.88rem; }
.drawer-head .scores { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
.drawer-head .big { font-family: var(--font-display); font-size: 1.6rem; font-weight: 800; }
.drawer-head .big small { font-size: 0.85rem; font-weight: 600; color: #c9d1ea; }
.drawer-head .qtag { background: #fff; color: var(--brand); border-radius: 6px; padding: 3px 9px; font-weight: 800; font-size: 0.8rem; }
.close { background: transparent; border: 1px solid #5a6ea6; color: #fff; border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 1.1rem; flex: none; }
.drawer-body { padding: 16px; display: grid; gap: 14px; }
.suggest { border-left: 4px solid var(--gold); background: var(--surface); border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; }
.suggest .k { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; }
.fitrow { display: grid; grid-template-columns: 150px auto minmax(0, 1fr); gap: 10px; align-items: start; padding: 9px 0; border-top: 1px solid var(--line); }
.fitrow:first-of-type { border-top: 0; }
.fitrow .name { font-weight: 700; font-size: 0.9rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); width: 30px; height: 28px; cursor: pointer; font-weight: 700; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--brand); color: #fff; }
.seg.locked button { cursor: default; }
.reason { font-size: 0.86rem; }
.src { font-size: 0.78rem; color: var(--muted); }
.warnline { color: var(--crit-ink); font-size: 0.78rem; font-weight: 700; }
@media (max-width: 560px) { .fitrow { grid-template-columns: minmax(0, 1fr) auto; } .fitrow .reason { grid-column: 1 / -1; } }
.access-ladder { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.rung { border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-size: 0.78rem; display: grid; gap: 2px; background: var(--surface); }
.rung b { font-family: var(--font-display); font-size: 1rem; }
.rung.on { background: color-mix(in srgb, var(--q-quick) 14%, var(--surface)); border-color: var(--q-quick); }
.rung.current { outline: 2px solid var(--q-quick); }
@media (max-width: 520px) { .access-ladder { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.label-v, .label-i, .label-u { font-size: 0.7rem; font-weight: 800; border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
.label-v { background: var(--brand); color: #fff; }
.label-i { border: 1px solid var(--brand); color: var(--ink); }
.label-u { border: 1px dashed var(--muted); color: var(--muted); }
:root[data-theme="dark"] .seg button[aria-pressed="true"], :root[data-theme="dark"] .filter[aria-pressed="true"] { background: var(--gold); color: var(--brand); border-color: var(--gold); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button[aria-pressed="true"], :root:not([data-theme="light"]) .filter[aria-pressed="true"] { background: var(--gold); color: var(--brand); border-color: var(--gold); } }
:root[data-theme="dark"] .label-v { background: var(--gold); color: var(--brand); }
:root[data-theme="dark"] .label-i { border-color: var(--gold); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .label-v { background: var(--gold); color: var(--brand); } :root:not([data-theme="light"]) .label-i { border-color: var(--gold); } }
.evi { display: grid; gap: 3px; padding: 9px 0; border-top: 1px solid var(--line); }
.evi:first-child { border-top: 0; }
.evi .top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.evi.inference .stmt { font-style: italic; }
.timeline { display: grid; }
.tl { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 0.88rem; }
.tl:first-child { border-top: 0; }

/* modal + toast */
.modal { position: fixed; inset: 0; display: grid; place-items: center; z-index: 70; padding: 16px; }
.modal .scrim { z-index: 1; }
.modal .box { position: relative; z-index: 2; background: var(--surface); border-radius: 12px; width: min(480px, 100%); padding: 20px; display: grid; gap: 12px; box-shadow: 0 20px 50px rgb(0 0 0 / 0.3); max-height: 90vh; overflow-y: auto; }
.modal h3 { font-size: 1.15rem; }
.field { display: grid; gap: 4px; font-size: 0.85rem; font-weight: 600; }
.field input, .field select, .field textarea { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface); font-weight: 400; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal .btns { display: flex; justify-content: flex-end; gap: 8px; }
.err { color: var(--crit-ink); font-size: 0.85rem; font-weight: 600; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 600; z-index: 80; box-shadow: 0 8px 20px rgb(0 0 0 / 0.25); max-width: calc(100% - 32px); }
footer { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 0 30px; color: var(--muted); font-size: 0.8rem; }
@media (prefers-reduced-motion: no-preference) {
  .drawer { animation: slide 0.18s ease-out; }
  @keyframes slide { from { transform: translateX(24px); opacity: 0.6; } to { transform: none; opacity: 1; } }
  .fitbar .fill, .meter span, .barrow .b { transition: width 0.25s ease; }
}

/* ---------- team tool additions ---------- */
.status { display: inline-flex; align-items: center; gap: 7px; border: 1px solid #5a6ea6; color: #dfe5f6; border-radius: 999px; padding: 3px 11px; font-size: 0.78rem; font-weight: 700; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #9fb0dd; }
.status.live::before { background: #3cc493; }
.status.off::before { background: #f08a8a; }
body.ro .w { display: none !important; }
.notice { padding: 14px 16px; display: grid; gap: 6px; border-left: 4px solid var(--gold); }
.notice p { margin: 0; }
.empty-hero { padding: 24px 20px; display: grid; gap: 10px; justify-items: start; }
.empty-hero h3 { font-size: 1.2rem; }
.empty-hero p { margin: 0; color: var(--muted); max-width: 62ch; }
.rowbtns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--muted); font-size: 0.8rem; font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.linkbtn:hover { color: var(--ink); }
.linkbtn[data-armed] { color: var(--crit-ink); }
.drawer-head .tools { display: flex; gap: 8px; align-items: center; }
.field .hint { font-weight: 400; color: var(--muted); font-size: 0.8rem; }
.check { display: flex; gap: 8px; align-items: center; font-size: 0.88rem; font-weight: 600; }
.radios { display: flex; gap: 6px; flex-wrap: wrap; border: 0; padding: 0; margin: 0; }
.radios legend { font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; padding: 0; }
.radios label { border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 700; display: inline-flex; gap: 6px; align-items: center; background: var(--surface); }

<div id="toast" class="toast" role="status" hidden></div>

<script>
/* ---------- dates and formatting ---------- */
const TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
const iso = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const D = n => { const d = new Date(TODAY); d.setDate(d.getDate() + n); return iso(d); };
const parse = s => new Date(s + "T00:00:00");
const days = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const todayIso = () => iso(TODAY);
const fmt = s => s ? parse(s).toLocaleDateString("en-GB", { day: "numeric", month: "short" }) : "—";
const fmtY = s => s ? parse(s).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "—";
const dkk = n => n == null || n === "" ? "—" : Number(n).toLocaleString("da-DK") + " DKK";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = x => JSON.parse(JSON.stringify(x ?? null));

/* ---------- rules and allowed values (docs/lean-spec.md) ---------- */
const SET = { fitHigh: 6, accessHigh: 2, pathCap: 5, renewalDays: 90, noReplyDays: 10, warmDays: 365, recheckDays: 183 };
const STAGES = ["Planned", "Contacted", "Meeting", "Proposal sent", "Negotiation", "Won", "Lost", "Nurture"];
const OPEN = ["Planned", "Contacted", "Meeting", "Proposal sent", "Negotiation"];
const LOST_REASONS = ["No budget", "Chose another organisation", "Not relevant for them", "Bad timing", "No response", "Terms not agreed", "We withdrew", "Other"];
const ACCESS_NAMES = ["No path", "Named person", "Introduction available", "Warm contact", "Champion / satisfied past partner"];
const NOT_SUITABLE = ["Executive assistant (routing only)", "Other"];
const INDUSTRIES = ["Professional services & consulting", "Finance, banking & insurance", "Technology & software", "Energy & utilities", "Life sciences & healthcare", "Consumer goods & retail", "Shipping, logistics & transport", "Manufacturing & industrials", "Media, marketing & communications", "Investors & startup ecosystem", "Public sector, NGOs & associations", "Hospitality, food & venues", "Other"];
const SIZES = ["Unknown", "<50", "50-249", "250-999", "1000+"];
const ROLES = ["Campus recruiter / early careers", "University relations", "Talent acquisition", "Employer branding", "HR manager / director", "Marketing", "Partnerships / sponsorship", "Communications", "CSR / sustainability", "Events / sales (venues)", "Community / ecosystem", "Subject-matter expert / speaker", "Founder / CEO (small company)", "Country manager / senior executive", "Executive assistant (routing only)", "Other"];
const CE_TYPES = ["None found (checked)", "Sponsors student organisations", "Sponsors university activities", "Sponsors similar events", "Previous CBS Talks partner", "Previous CBS Talks spend"];
const OPP_TYPES = ["Speaker", "Recruitment", "Event sponsor", "Recurring sponsor", "Annual partner", "Knowledge", "Content", "Networking", "In-kind"];
const KINDS = ["Cash", "In-kind", "Non-cash"];
const CHANNELS = ["Email", "LinkedIn", "Call", "Meeting", "Event", "Other"];
const DIRS = ["Sent by us", "Received from them", "Two-way"];
const OUTCOMES = ["Positive", "Neutral", "Negative", "No reply"];
const SATISFACTION = ["Unknown", "Satisfied", "Neutral", "Unsatisfied"];
const LABELS = ["Verified fact", "Source-backed inference", "Unknown"];
const CRIT = {
  f1: ["F1 Student pull", "Would our audience come?", "Checked: no sign CBS students care about this company or its field", "Relevant to some study lines, or moderate interest", "Clear demand: past CBS Talks attendance, a strong poll result, or explicit student requests"],
  f2: ["F2 Content fit", "Do they have a story or person for our themes?", "No link to any current theme", "A relevant topic, but no named speaker or concrete idea", "A named person or a concrete event idea that fits a current theme"],
  f3: ["F3 Reason to work with us", "What's in it for them?", "Checked: nothing we offer helps them", "Some hiring of business profiles or some interest in our topics", "Clear, recurring hiring of CBS-type profiles, or an active public agenda on one of our themes"],
  f5: ["F5 Long-term potential", "Could this repeat?", "One-off reason only", "Could plausibly repeat", "A recurring need across years, or a past multi-year partnership"],
};

/* ---------- shared state (filled live from the database) ---------- */
let S = { companies: [], opps: [], interactions: [] };
let CFG = { semester: { name: "", start: "", end: "", target: 0 }, packages: [], team: [] };
const loaded = { companies: false, opps: false, interactions: false, config: false };
const ready = () => Object.values(loaded).every(Boolean);
let DB = null, DL = null, canWrite = false, conn = "connecting";

const me = () => { try { return localStorage.getItem("cbs-desk-me") || ""; } catch (e) { return ""; } };
const setMe = v => { try { localStorage.setItem("cbs-desk-me", v); } catch (e) {} };
const activeTeam = () => CFG.team.filter(t => t.active !== false).map(t => t.name);
const defaultOwner = () => me() || activeTeam()[0] || "";

function withKeys(list) { return (list || []).map((x, i) => x && x.k ? x : { ...x, k: "i" + i }); }
function normCompany(id, d) {
  const fit = d.fit || {};
  const f = k => Array.isArray(fit[k]) ? [fit[k][0] ?? null, fit[k][1] || "", fit[k][2] || ""] : [null, "", ""];
  return { ...d, id, name: d.name || "(no name)", industry: d.industry || "Other", size: d.size || "Unknown", owner: d.owner || "",
    fit: { f1: f("f1"), f2: f("f2"), f3: f("f3"), f5: f("f5") }, intro: d.intro || "", need: d.need || "", path: d.path || null, dnc: !!d.dnc,
    commercial: withKeys(d.commercial), contacts: withKeys(d.contacts), evidence: withKeys(d.evidence) };
}
const bodyOf = x => { const b = clone(x); delete b.id; return b; };

/* ---------- rules (lean spec §2–§3) ---------- */
const co = id => S.companies.find(c => c.id === id);
const oppsOf = id => S.opps.filter(o => o.co === id);
const isOpen = o => OPEN.includes(o.stage);
const teamActive = n => { const t = CFG.team.find(t => t.name === n); return !t || t.active !== false; };

function f4(c) {
  const t = c.commercial.map(e => e.type);
  if (!t.length) return null;
  if (t.includes("Previous CBS Talks spend") || t.includes("Sponsors student organisations")) return 2;
  if (t.some(x => ["Sponsors university activities", "Sponsors similar events", "Previous CBS Talks partner"].includes(x))) return 1;
  return 0;
}
function fit(c) {
  const v = [c.fit.f1[0], c.fit.f2[0], c.fit.f3[0], f4(c), c.fit.f5[0]];
  return v.some(x => x == null) ? null : v.reduce((a, b) => a + b, 0);
}
function access(c) {
  const contacts = c.contacts.filter(p => !p.left && !p.dnc);
  const champ = contacts.find(p => p.rel === "Champion");
  if (champ) return { level: 4, why: `${champ.name}${champ.title ? " (" + champ.title + ")" : ""} is a champion` };
  const sat = oppsOf(c.id).find(o => o.stage === "Won" && o.satisfaction === "Satisfied");
  if (sat) return { level: 4, why: "Satisfied past partner" };
  const warm = S.interactions.filter(i => i.co === c.id && i.outcome === "Positive" && days(i.date, todayIso()) <= SET.warmDays
    && contacts.some(p => p.name === i.contact)).sort((a, b) => b.date.localeCompare(a.date))[0];
  if (warm) return { level: 3, why: `${warm.contact} responded positively on ${fmt(warm.date)}` };
  if (c.intro) return { level: 2, why: c.intro };
  const named = contacts.find(p => !NOT_SUITABLE.includes(p.role));
  if (named) return { level: 1, why: `${named.name}${named.title ? ", " + named.title : ""}` };
  return { level: 0, why: "No named contact and no introduction route yet" };
}
function quadrant(c) {
  if (c.dnc) return "Do not contact";
  const f = fit(c), a = access(c).level;
  if (f == null) return "Research";
  if (f >= SET.fitHigh && a >= SET.accessHigh) return "Priority";
  if (f >= SET.fitHigh) return "Build a Path";
  if (a >= SET.accessHigh) return "Quick Win";
  return "Low Priority";
}
const qClass = q => q.split(" ")[0];
function lastContact(id) { return S.interactions.filter(i => i.co === id).map(i => i.date).sort().pop() || ""; }
function oppFlag(o) {
  const t = todayIso();
  if (o.stage === "Won" && o.renewalDate && days(t, o.renewalDate) <= SET.renewalDays
    && !S.opps.some(x => x.co === o.co && x.renewal && isOpen(x))) return "Renewal due";
  if (!isOpen(o)) return "";
  if (!o.next || !o.due) return "Missing next action";
  if (days(t, o.due) < 0) return "Overdue";
  if (o.stage === "Contacted") {
    const ints = S.interactions.filter(i => i.co === o.co);
    const sent = ints.filter(i => i.dir === "Sent by us").map(i => i.date).sort().pop();
    const recv = ints.filter(i => i.dir !== "Sent by us").map(i => i.date).sort().pop() || "";
    if (sent && days(sent, t) >= SET.noReplyDays && recv < sent) return "No reply";
  }
  if (days(t, o.due) <= 7) return "Due this week";
  return "";
}
function suggestion(c) {
  const ren = oppsOf(c.id).find(o => oppFlag(o) === "Renewal due");
  if (ren) return ren.satisfaction === "Satisfied" ? `Renewal: propose the same package${ren.pkg ? " (" + ren.pkg + ")" : ""} or one level up.` : "Renewal: propose the same package and ask what would make it more valuable.";
  const a = access(c).level, f = f4(c), out = [];
  if (c.fit.f2[0] === 2) out.push("Speaker (cheapest first step)");
  if (c.fit.f3[0] === 2) out.push("Recruitment event or case workshop");
  if (f === 2 && a >= 3) out.push("Sponsorship package");
  if (c.need) out.push(`In-kind / specific need: ${c.need}`);
  if (!out.length) return "Nothing on the cheat sheet fits yet. Don't approach now.";
  const money = a < 3 ? " No cash ask in the first contact (Access below Warm)." : "";
  return out.join(" · ") + "." + money;
}
function checks(c) {
  const out = [];
  if (!c.owner) out.push("No owner");
  else if (!teamActive(c.owner)) out.push("Needs new owner");
  ["f1", "f2", "f3", "f5"].forEach(k => { if (c.fit[k][0] === 2 && !c.fit[k][2]) out.push("Source missing for a 2"); });
  if (c.contacts.some(p => !p.left && (!p.verified || days(p.verified, todayIso()) > SET.recheckDays))) out.push("Re-check contact");
  if (c.evidence.some(e => e.ai && !e.checked)) out.push("Unchecked AI evidence");
  if (!c.commercial.length) out.push("Add commercial evidence");
  if (oppsOf(c.id).some(o => o.stage === "Won" && o.satisfaction === "Unknown" && o.end && o.end < todayIso())) out.push("Record satisfaction");
  return [...new Set(out)];
}

/* ---------- work queue (§3.5) ---------- */
function queue() {
  const order = { "Renewal due": 1, "Overdue": 2, "No reply": 3, "Due this week": 4, "Missing next action": 5 };
  const deals = S.opps.filter(o => co(o.co)).map(o => ({ o, flag: oppFlag(o) })).filter(x => x.flag)
    .sort((a, b) => order[a.flag] - order[b.flag] || ((a.flag === "Renewal due" ? a.o.renewalDate : a.o.due) || "9").localeCompare((b.flag === "Renewal due" ? b.o.renewalDate : b.o.due) || "9"));
  const renewals = deals.filter(x => x.flag === "Renewal due");
  const follow = deals.filter(x => x.flag !== "Renewal due");
  const sortFit = (a, b) => fit(b) - fit(a) || access(b).level - access(a).level;
  const prio = S.companies.filter(c => quadrant(c) === "Priority" && !oppsOf(c.id).some(isOpen) && !oppsOf(c.id).some(o => oppFlag(o) === "Renewal due")).sort(sortFit);
  const paths = S.companies.filter(c => c.path && !c.dnc).sort((a, b) => (a.path.started || "").localeCompare(b.path.started || ""));
  const quick = S.companies.filter(c => quadrant(c) === "Quick Win" && c.need && !oppsOf(c.id).some(isOpen)).sort(sortFit);
  const room = SET.pathCap - paths.length;
  const cands = room > 0 ? S.companies.filter(c => quadrant(c) === "Build a Path" && !c.path).sort(sortFit).slice(0, room) : [];
  return { renewals, follow, prio, paths, quick, cands };
}

/* ---------- database writes ---------- */
function errText(e) {
  const c = e && e.code;
  if (c === "offline") return "Not connected. Open the shared link in claude.ai to save changes.";
  if (c === "invalid_argument") { canWrite = false; schedule(); return "This change wasn't saved. You may only have view access: ask the Partnerships Manager to make you a Contributor."; }
  if (c === "quota_exceeded") return "The shared database is full. Remove example data or old entries, then try again.";
  if (c === "resource_exhausted") return "Too many changes at once. Wait a few seconds and try again.";
  if (c === "revoked") return "Your access to this page changed. Reload the page.";
  return "Couldn't save. Check your connection and try again.";
}
async function run(fn) {
  if (!DB) throw { code: "offline" };
  try { return await fn(); } catch (e) {
    if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 400 + Math.random() * 600)); return await fn(); }
    throw e;
  }
}
/* each write waits (briefly) until the change is back in the page's own state, so the next step sees it */
const snapVer = { companies: 0, opps: 0, interactions: 0, config: 0 };
async function synced(col, fn) {
  const v = snapVer[col]; await run(fn);
  for (let i = 0; i < 30 && snapVer[col] === v; i++) await new Promise(r => setTimeout(r, 50));
}
const put = (col, id, body) => synced(col, () => DB.collection(col).doc(id).set(body));
const patch = (col, id, body) => synced(col, () => DB.collection(col).doc(id).update(body));
const del = (col, id) => synced(col, () => DB.collection(col).doc(id).delete());
async function act(fn, ok) { try { await fn(); if (ok) toast(ok); } catch (e) { toast(errText(e)); } }

/* ---------- UI shell ---------- */
const TABS = [["today", "Today"], ["assistant", "Assistant"], ["matrix", "Matrix"], ["companies", "Companies"], ["pipeline", "Pipeline"], ["dashboard", "Dashboard"], ["settings", "Settings"]];
let current = "today";
try { const t = localStorage.getItem("cbs-desk-tab"); if (TABS.some(x => x[0] === t)) current = t; } catch (e) {}
let companyFilter = "All", companySearch = "", openCompany = null;

let pending = false;
function schedule() { if (pending) return; pending = true; requestAnimationFrame(() => { pending = false; render(); }); }

function renderTabs() {
  const q = queue();
  const urgent = q.renewals.length + q.follow.filter(x => x.flag === "Overdue" || x.flag === "No reply").length;
  document.getElementById("tabs").innerHTML = TABS.map(([id, label]) =>
    `<button class="tab" role="tab" id="tab-${id}" aria-selected="${id === current}" data-tab="${id}">${label}${id === "today" && urgent ? ` <span class="count alert">${urgent}</span>` : ""}</button>`).join("");
}
function renderStatus() {
  const el = document.getElementById("status");
  const [cls, text] = conn === "connecting" ? ["", "Connecting…"]
    : conn === "offline" ? ["off", "Not connected: changes can't be saved"]
    : conn === "error" ? ["off", "Connection lost: reload the page"]
    : canWrite ? ["live", "Live · changes are saved"] : ["live", "Read only"];
  el.className = "status " + cls; el.textContent = text;
}
function render() {
  const a = document.activeElement, fid = a && a.id;
  let sel = null; try { if (a && typeof a.selectionStart === "number") sel = [a.selectionStart, a.selectionEnd]; } catch (e) {}
  document.body.classList.toggle("ro", !canWrite);
  const s = CFG.semester;
  document.getElementById("semester-line").textContent = s.name || s.start
    ? `${s.name || "Semester"} · ${fmtY(s.start)} – ${fmtY(s.end)} · Bringing leadership to CBS` : "Bringing leadership to CBS";
  renderStatus(); renderTabs();
  const views = { today: viewToday, matrix: viewMatrix, companies: viewCompanies, pipeline: viewPipeline, dashboard: viewDashboard, settings: viewSettings, assistant: viewAssistant };
  document.getElementById("view").innerHTML = ready() || current === "settings" || (current === "assistant" && CHAT.off) ? views[current]() : viewLoading();
  if (openCompany) { if (co(openCompany)) renderDrawer(false); else closeDrawer(); }
  if (fid && !document.getElementById("modal")) {
    const el = document.getElementById(fid);
    if (el && el !== document.activeElement) { el.focus(); if (sel) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} }
  }
}
function viewLoading() {
  if (conn === "offline") return `<section class="card notice"><h3>Open the shared link in claude.ai</h3>
    <p>The Partnership Desk keeps the team's data in a shared database that only works when the page is opened from claude.ai while you are signed in. Ask the Partnerships Manager for the link.</p></section>`;
  if (conn === "error") return `<section class="card notice"><h3>Connection lost</h3><p>Reload the page to reconnect. Nothing you saved before is lost.</p></section>`;
  return `<section class="card notice"><p class="muted">Loading the team's data…</p></section>`;
}

const flagPill = f => {
  const cls = { "Renewal due": "info", "Overdue": "crit", "No reply": "crit", "Due this week": "warn", "Missing next action": "crit" }[f] || "info";
  const ic = { "Renewal due": "↻", "Overdue": "!", "No reply": "…", "Due this week": "◷", "Missing next action": "!" }[f] || "";
  return `<span class="pill ${cls}"><span class="ic" aria-hidden="true">${ic}</span>${esc(f)}</span>`;
};
const qPill = q => `<span class="qpill ${qClass(q)}">${esc(q)}</span>`;
const fitBar = c => { const f = fit(c); return f == null ? `<span class="muted small">not fully rated</span>`
  : `<span class="fitbar"><span class="track"><span class="fill" style="width:${f * 10}%"></span></span><b class="num">${f}</b><span class="muted small">/10</span></span>`; };
const ladder = c => { const a = access(c).level; return `<span class="ladder" aria-label="Access ${a} of 4">${[1, 2, 3, 4].map(i => `<i class="${i <= a ? "on" : ""}"></i>`).join("")}</span> <span class="small">${ACCESS_NAMES[a]}</span>`; };
const ownerText = n => n ? esc(n) + (teamActive(n) ? "" : " (left: needs new owner)") : "no owner";

/* ---------- Today ---------- */
function emptyHero() {
  return `<section class="card empty-hero"><h3>No companies yet</h3>
    <p>Add the first company you want to work on. Rate its Fit, add a contact and the desk works out where it belongs. New to the desk? Load the example companies in Settings to practise first.</p>
    <div class="rowbtns w"><button class="btn primary" data-act="addco">Add a company</button><button class="btn" data-tab="settings">Go to Settings</button></div>
    ${canWrite ? "" : `<p class="small">You have view access, so you can read but not add. Ask the Partnerships Manager for Contributor access.</p>`}</section>`;
}
function viewToday() {
  if (!S.companies.length) return `<div class="view-head"><div><h2>Today</h2><p>Your weekly work queue appears here.</p></div></div>${emptyHero()}`;
  const q = queue();
  const dealRow = ({ o, flag }) => { const c = co(o.co); return `
    <div class="qrow">
      <div><button class="co" data-open="${c.id}">${esc(c.name)}</button><div class="meta">${esc(o.type)} · ${esc(o.stage)} · ${ownerText(o.owner)}</div></div>
      <div>${flag === "Renewal due" ? `Renewal date <b>${fmt(o.renewalDate)}</b> · satisfaction: ${esc(o.satisfaction || "Unknown")}<div class="meta">${esc(suggestion(c))}</div>`
        : `${esc(o.next || "Add a next action")}<div class="meta">${o.due ? "due " + fmt(o.due) : "no due date"}</div>`}</div>
      <div class="actions">${flagPill(flag)}${flag === "Renewal due"
        ? `<button class="btn small primary w" data-act="renew" data-opp="${o.id}">Start renewal</button>`
        : `<button class="btn small primary w" data-act="log" data-opp="${o.id}">Log contact</button>`}</div>
    </div>`; };
  const coRow = (c, why, next) => `
    <div class="qrow">
      <div><button class="co" data-open="${c.id}">${esc(c.name)}</button><div class="meta">Fit ${fit(c) ?? "—"}/10 · ${ACCESS_NAMES[access(c).level]} · ${ownerText(c.owner)}</div></div>
      <div>${esc(next)}<div class="meta">${esc(why)}</div></div>
      <div class="actions">${qPill(quadrant(c))}<button class="btn small" data-open="${c.id}">Open</button></div>
    </div>`;
  const sec = (n, title, sub, rows, empty) => `
    <section class="card section"><div class="section-head"><h3><span class="step">${n}</span>${title}</h3><span class="muted small">${sub}</span></div>
    ${rows.length ? rows.join("") : `<div class="empty">${empty}</div>`}</section>`;
  return `
  <div class="view-head"><div><h2>Today</h2><p>Work from the top: renewals, follow-ups, priority prospects, then building paths. Click a company for details.</p></div>
  <div class="rowbtns"><span class="muted small">${fmtY(todayIso())}</span><button class="btn w" data-act="addco">Add company</button></div></div>
  ${sec(1, "Renewals", `partners whose renewal date is within ${SET.renewalDays} days`, q.renewals.map(dealRow), "No renewals due.")}
  ${sec(2, "Follow-ups", "overdue · no reply · due this week · missing next action", q.follow.map(dealRow), "Nothing due this week.")}
  ${sec(3, "Priority prospects without a deal", "high Fit, high Access", q.prio.map(c => coRow(c, "Suggested first step (cheat sheet)", suggestion(c))), "Every Priority company has a deal in progress.")}
  ${sec(4, "Building paths", `${q.paths.length} of ${SET.pathCap} in progress`, [
      ...q.paths.map(c => coRow(c, `Path started ${fmt(c.path.started)}`, c.path.action)),
      ...q.cands.map(c => coRow(c, "Path candidate: high Fit, no way in yet", "Decide whether to start a path"))], "No paths in progress.")}
  ${q.quick.length ? sec("+", "Quick wins for a current need", "low Fit, high Access, only for a specific need", q.quick.map(c => coRow(c, "Quick win", "Need: " + c.need)), "") : ""}`;
}

/* ---------- Matrix ---------- */
function viewMatrix() {
  if (!S.companies.length) return `<div class="view-head"><div><h2>Matrix</h2></div></div>${emptyHero()}`;
  const by = q => S.companies.filter(c => quadrant(c) === q).sort((a, b) => fit(b) - fit(a) || access(b).level - access(a).level);
  const chip = c => `<button class="chip" data-open="${c.id}">${esc(c.name)} <span class="sc num">Fit ${fit(c) ?? "—"} · A${access(c).level}</span></button>`;
  const quad = (q, rule, extra = "") => `<div class="quad ${qClass(q)}"><h3>${q}<span class="muted small num">${by(q).length}</span></h3><div class="rule">${rule}${extra}</div>
    <div class="chips">${by(q).map(chip).join("") || `<span class="muted small">None</span>`}</div></div>`;
  const paths = S.companies.filter(c => c.path && !c.dnc).length;
  const research = by("Research"), dnc = by("Do not contact");
  return `
  <div class="view-head"><div><h2>Matrix</h2><p>Fit (0–10) against Access (0–4). High Fit is ${SET.fitHigh}+, high Access is "Introduction available" or better.</p></div></div>
  <div class="matrix">
    <div class="axis-y">Fit → high</div>
    ${quad("Build a Path", "High Fit, low Access. Work on an introduction.", ` <b>${paths} / ${SET.pathCap} paths in progress.</b>`)}
    ${quad("Priority", "High Fit, high Access. Contact now: owner and first contact within 2 weeks.")}
    ${quad("Low Priority", "Low Fit, low Access. No outreach; re-check yearly.")}
    ${quad("Quick Win", "Low Fit, high Access. Only for a specific current need.")}
    <div></div><div class="axis-x" style="grid-column:2/4"><span>← low Access</span><span>high Access →</span></div>
  </div>
  <section class="card section"><div class="section-head"><h3>Research</h3><span class="muted small">not fully rated yet, so outside the matrix</span></div>
  <div class="chips">${research.map(chip).join("") || `<span class="muted small">None</span>`}</div></section>
  ${dnc.length ? `<section class="card section"><div class="section-head"><h3>Do not contact</h3><span class="muted small">flagged by the team</span></div><div class="chips">${dnc.map(chip).join("")}</div></section>` : ""}`;
}

/* ---------- Dashboard ---------- */
function viewDashboard() {
  const sm = CFG.semester, hasSem = sm.start && sm.end;
  const opps = S.opps.filter(o => co(o.co));
  const sem = o => hasSem && o.closed && o.closed >= sm.start && o.closed <= sm.end;
  const wonSem = opps.filter(o => o.stage === "Won" && sem(o));
  const lostSem = opps.filter(o => o.stage === "Lost" && sem(o));
  const cashWon = wonSem.filter(o => o.kind === "Cash").reduce((s, o) => s + (Number(o.agreed) || 0), 0);
  const proposed = opps.filter(o => ["Proposal sent", "Negotiation"].includes(o.stage) && o.kind === "Cash").reduce((s, o) => s + (Number(o.proposed) || 0), 0);
  const target = Number(sm.target) || 0;
  const pct = target ? Math.min(cashWon / target, 1) : 0;
  const stageCounts = OPEN.concat(["Nurture"]).map(s => [s, opps.filter(o => o.stage === s).length]);
  const maxC = Math.max(1, ...stageCounts.map(x => x[1]));
  const quads = ["Priority", "Build a Path", "Quick Win", "Low Priority", "Research", "Do not contact"].map(q => [q, S.companies.filter(c => quadrant(c) === q).length]);
  const health = [
    ["Open deals without a next action", opps.filter(o => oppFlag(o) === "Missing next action").length],
    ["Companies without an owner", S.companies.filter(c => !c.owner).length],
    ["Items with an owner who left", S.companies.filter(c => c.owner && !teamActive(c.owner)).length + opps.filter(o => isOpen(o) && o.owner && !teamActive(o.owner)).length],
    ["Contacts to re-check (> 6 months)", S.companies.flatMap(c => c.contacts).filter(p => !p.left && (!p.verified || days(p.verified, todayIso()) > SET.recheckDays)).length],
    ["Unchecked AI evidence", S.companies.flatMap(c => c.evidence).filter(e => e.ai && !e.checked).length],
    ["Won deals missing satisfaction", opps.filter(o => o.stage === "Won" && o.satisfaction === "Unknown" && o.end && o.end < todayIso()).length],
  ];
  const noncash = opps.filter(o => o.kind !== "Cash" && o.stage !== "Lost");
  const reasons = LOST_REASONS.map(r => [r, lostSem.filter(o => o.lost === r).length]).filter(x => x[1]);
  return `
  <div class="view-head"><div><h2>Dashboard</h2><p>Counts and recorded amounts only: no probabilities, no expected values, no budget estimates.</p></div></div>
  ${hasSem ? "" : `<section class="card notice"><p><b>Set the semester dates in Settings.</b> "Won this semester" and "Lost this semester" use them.</p></section>`}
  <div class="kpis">
    <div class="card kpi"><span class="label">Cash won this semester</span><span class="value">${dkk(cashWon)}</span>
      ${target ? `<div class="meter" role="img" aria-label="${Math.round(pct * 100)}% of target"><span style="width:${pct * 100}%"></span></div>
      <span class="muted small">${Math.round(pct * 100)}% of the ${dkk(target)} target</span>` : `<span class="muted small">No cash target set (Settings)</span>`}</div>
    <div class="card kpi"><span class="label">Proposed, not committed</span><span class="value">${dkk(proposed)}</span><span class="muted small">cash in Proposal sent + Negotiation</span></div>
    <div class="card kpi"><span class="label">Open deals</span><span class="value num">${opps.filter(isOpen).length}</span><span class="muted small">${noncash.filter(isOpen).length} of them non-cash or in-kind</span></div>
    <div class="card kpi"><span class="label">Renewals due</span><span class="value num">${queue().renewals.length}</span><span class="muted small">within ${SET.renewalDays} days</span></div>
  </div>
  <div class="grid2">
    <section class="card section"><div class="section-head"><h3>Open deals by stage</h3></div>
      <div class="bars">${stageCounts.map(([s, n]) => `<div class="barrow"><span>${s}</span><span class="tr"><span class="b ${n ? "" : "zero"}" style="display:block;width:${n / maxC * 85}%"></span><span class="v num" style="left:${n / maxC * 85}%">${n}</span></span></div>`).join("")}</div></section>
    <section class="card section"><div class="section-head"><h3>Companies by quadrant</h3></div>
      <div class="list">${quads.map(([q, n]) => `<div class="li">${qPill(q)}<b class="num">${n}</b></div>`).join("")}</div></section>
    <section class="card section"><div class="section-head"><h3>Won this semester</h3></div>
      <div class="list">${wonSem.map(o => `<div class="li"><span><b>${esc(co(o.co).name)}</b> <span class="muted small">${esc(o.type)} · renewal ${fmt(o.renewalDate)} · ${esc(o.satisfaction || "Unknown")}</span></span><b class="num">${o.kind === "Cash" ? dkk(o.agreed) : esc(o.noncash)}</b></div>`).join("") || `<div class="empty">None yet.</div>`}</div></section>
    <section class="card section"><div class="section-head"><h3>Lost this semester</h3></div>
      <div class="list">${lostSem.map(o => `<div class="li"><span><b>${esc(co(o.co).name)}</b> <span class="muted small">${esc(o.type)}</span></span><span class="pill info">${esc(o.lost)}</span></div>`).join("") || `<div class="empty">None.</div>`}</div>
      ${reasons.length ? `<div class="muted small">Reasons: ${reasons.map(([r, n]) => `${esc(r)} (${n})`).join(" · ")}</div>` : ""}</section>
    <section class="card section"><div class="section-head"><h3>Non-cash and in-kind</h3><span class="muted small">listed, not summed in DKK</span></div>
      <div class="list">${noncash.map(o => `<div class="li"><span><b>${esc(co(o.co).name)}</b> <span class="muted small">${esc(o.noncash || o.type)}</span></span><span class="small">${esc(o.stage)}</span></div>`).join("") || `<div class="empty">None.</div>`}</div></section>
    <section class="card section"><div class="section-head"><h3>Data health</h3></div>
      <div class="list">${health.map(([l, n]) => `<div class="li"><span>${l}</span>${n ? `<span class="pill crit">${n}</span>` : `<span class="pill good">0</span>`}</div>`).join("")}</div></section>
  </div>`;
}

  ${sec("Access", "", `<p class="small" style="margin:0">Only you can open this page until you share it from the Share menu. If you share it later, give CBS Talks team members <b>Contributor</b> access so they can make changes; Viewers can only read.</p>`)}

/* ---------- modals ---------- */
function modal(title, html, onSubmit, opts = {}) {
  closeModal(false);
  const host = document.createElement("div");
  host.className = "modal"; host.id = "modal";
  host.innerHTML = `<div class="scrim" data-mclose></div><form class="box" role="dialog" aria-modal="true" aria-labelledby="m-title" novalidate>
    <h3 id="m-title">${title}</h3>${html}<div class="err" id="m-err" role="alert" hidden></div>
    <div class="btns"><button type="button" class="btn" data-mclose>Cancel</button><button type="submit" class="btn primary" id="m-save">${opts.save || "Save"}</button></div></form>`;
  document.body.appendChild(host);
  const form = host.querySelector("form");
  const first = form.querySelector("input:not([type=radio]):not([type=checkbox]), select, textarea"); if (first) first.focus();
  host.addEventListener("click", e => { if (e.target.closest("[data-mclose]")) closeModal(true); });
  if (opts.onReady) opts.onReady(form);
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form).entries());
    form.querySelectorAll("input[type=checkbox]").forEach(cb => { data[cb.name] = cb.checked; });
    Object.keys(data).forEach(k => { if (typeof data[k] === "string") data[k] = data[k].trim(); });
    const btn = form.querySelector("#m-save"); btn.disabled = true;
    let err; try { err = await onSubmit(data); } catch (x) { err = errText(x); }
    btn.disabled = false;
    if (err) { const el = form.querySelector("#m-err"); el.textContent = err; el.hidden = false; return; }
    closeModal(true);
  });
}
function closeModal(rerender) { const m = document.getElementById("modal"); if (m) m.remove(); if (rerender) render(); }
const opts = (list, sel) => list.map(x => `<option ${x === sel ? "selected" : ""}>${esc(x)}</option>`).join("");
const vopts = (pairs, sel) => pairs.map(([v, l]) => `<option value="${esc(v)}" ${v === sel ? "selected" : ""}>${esc(l)}</option>`).join("");
const ownerOpts = sel => vopts([["", "No owner yet"], ...[...new Set([...activeTeam(), ...(sel ? [sel] : [])])].map(n => [n, n])], sel);
const contactOpts = (c, sel) => vopts([["", "—"], ...(c ? c.contacts.filter(p => !p.dnc).map(p => [p.name, p.name + (p.left ? " (left)" : "")]) : [])], sel || "");
const field = (label, input, hint) => `<label class="field">${label}${input}${hint ? `<span class="hint">${hint}</span>` : ""}</label>`;
const inp = (name, value, extra = "") => `<input name="${name}" id="f-${name}" value="${esc(value ?? "")}" ${extra}>`;
const chk = (name, checked, label) => `<label class="check"><input type="checkbox" name="${name}" id="f-${name}" ${checked ? "checked" : ""}> ${label}</label>`;

const REQUIRE = {
  "Proposal sent": o => o.kind === "Cash" && !o.pkg && !o.proposed ? ["pkg"] : [],
  "Won": o => [...(o.kind === "Cash" && !o.agreed ? ["agreed"] : []), ...(!o.renewalDate ? ["renewalDate"] : [])],
  "Lost": o => o.lost ? [] : ["lost"],
  "Nurture": o => [...(!o.nurture ? ["nurture"] : []), ...(!o.nurtureUntil ? ["nurtureUntil"] : [])],
};
function moveStage(id, stage) {
  const o = S.opps.find(x => x.id === id); const c = co(o.co);
  const need = (REQUIRE[stage] || (() => []))(o);
  const apply = async extra => { await applyStage(o, stage, extra); toast(`${c.name} moved to ${stage}.`); };
  if (!need.length) { act(() => apply({})); return; }
  const pk = CFG.packages;
  const fields = {
    pkg: (pk.length ? field("Package", `<select name="pkg" id="f-pkg">${vopts([["", "No package"], ...pk.map(p => [p.name, `${p.name} (${dkk(p.price)})`])], "")}</select>`) : "")
      + field("Proposed value (DKK)", inp("proposed", "", 'type="number" min="0" step="500"'), pk.length ? "Leave empty to use the package price." : ""),
    agreed: field("Agreed value (DKK)", inp("agreed", o.proposed || "", 'type="number" min="0" step="500"')),
    renewalDate: field("Renewal date", inp("renewalDate", D(300), 'type="date"')),
    lost: field("Lost reason", `<select name="lost" id="f-lost">${opts(LOST_REASONS, "No budget")}</select>`),
    nurture: field("Why nurture?", inp("nurture", "", 'placeholder="e.g. budget decided in spring"')),
    nurtureUntil: field("Revisit on", inp("nurtureUntil", D(90), 'type="date"')),
  };
  modal(`Move ${esc(c.name)} to ${esc(stage)}`, `<p class="muted small" style="margin:0">This stage requires:</p>${need.map(k => fields[k]).join("")}`, async d => {
    const extra = {};
    if (need.includes("pkg")) {
      const p = pk.find(p => p.name === d.pkg);
      if (!p && !(Number(d.proposed) > 0)) return "Choose a package or enter the proposed value.";
      if (p) extra.pkg = p.name;
      extra.proposed = Number(d.proposed) > 0 ? Number(d.proposed) : p.price;
    }
    if (need.includes("agreed")) { if (!(Number(d.agreed) > 0)) return "Enter the agreed value."; extra.agreed = Number(d.agreed); }
    if (need.includes("nurture") && !d.nurture) return "Say why this is parked.";
    ["renewalDate", "lost", "nurture", "nurtureUntil"].forEach(k => { if (d[k]) extra[k] = d[k]; });
    await apply(extra);
  });
}

async function backup() {
  const data = JSON.stringify({ exportedOn: new Date().toISOString(), settings: CFG, companies: S.companies, opps: S.opps, interactions: S.interactions }, null, 2);
  if (!DL) { toast("Downloads aren't available in this view. Open the page in claude.ai."); return; }
  try { await DL.save({ filename: `cbs-talks-partnership-desk-${todayIso()}.json`, data }); toast("Backup ready."); }
  catch (e) { if (!e || e.code !== "declined") toast(e && e.code === "not_granted" ? "Allow downloads for this page to save backups." : "The backup couldn't be saved. Try again."); }
}

function restoreFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let b; try { b = JSON.parse(reader.result); } catch (e) { toast("That file isn't a Partnership Desk backup."); return; }
    if (!b || !Array.isArray(b.companies) || !Array.isArray(b.opps) || !Array.isArray(b.interactions)) { toast("That file isn't a Partnership Desk backup."); return; }
    modal("Restore from backup", `<p style="margin:0">Backup from <b>${esc(fmtY((b.exportedOn || "").slice(0, 10)))}</b>: ${b.companies.length} companies, ${b.opps.length} deals and ${b.interactions.length} contact log entries.</p>
      <p class="muted small" style="margin:0">Everything in the file is written back. Items that still exist are overwritten with the backup version; nothing else is deleted.</p>`, async () => {
      for (const c of b.companies) { if (c && c.id) await put("companies", c.id, bodyOf(c)); }
      for (const o of b.opps) { if (o && o.id) await put("opps", o.id, bodyOf(o)); }
      for (const i of b.interactions) { if (i && i.id) await put("interactions", i.id, bodyOf(i)); }
      if (b.settings) {
        await put("config", "settings", { semester: b.settings.semester || CFG.semester, packages: b.settings.packages || [] });
        await put("config", "team", { members: b.settings.team || [] });
      }
      toast("Backup restored.");
    }, { save: "Restore" });
  };
  reader.readAsText(file);
}

const ASSISTANT_RULES = `You are the assistant inside the CBS Talks Partnership Desk, the partnership system of CBS Talks, a student organisation at Copenhagen Business School that runs talks with business leaders. You help the Partnerships Manager decide which companies to work on, keep the records up to date and prepare outreach.

How the desk works:
- Two scores only. Fit (0-10) = F1 Student pull + F2 Content fit + F3 Reason to work with CBS Talks + F4 Track record + F5 Long-term potential, each 0-2. F4 is derived from commercial evidence, never rated by hand. Fit is incomplete until all five exist.
- Access (0-4) is calculated, never typed: 4 champion contact or satisfied past partner, 3 positive interaction with a current contact within a year, 2 an introduction path, 1 a named contact in a suitable role, 0 none.
- Quadrants: Priority (Fit 6+ and Access 2+), Build a Path (Fit 6+, Access below 2, at most 5 paths at a time), Quick Win (Fit below 6, Access 2+, only for a specific current need), Low Priority, Research (Fit incomplete), Do not contact.
- Work queue order: renewals, overdue, no reply, due this week, missing next action, priority prospects without a deal, paths in progress, quick wins, path candidates.
- No cash ask in a first contact unless Access is 3 or more.

Rules you must follow:
- Never invent facts about companies or people. If something is not in the data, in what the user told you or in a source you found, say it is unknown and suggest what to check.
- No budget estimates: never guess what a company could or would pay. Only amounts CBS Talks actually received or agreed are recorded.
- Guesses become questions: never present a company's likely goals or objections as fact; turn them into questions to ask them.
- Contacts: work data only (a published work email or LinkedIn profile), no guessed emails, no personal opinions about people.
- Change data only when the user asks you to, using the tools, and only with information the user gave you or that is already in the desk. Never rate Fit from your own judgement: you may suggest a rating in your reply, but write it only when the user states or confirms it. A rating of 2 needs a source.
- Evidence you add is stored as an AI draft that a person must verify.
- If a request is ambiguous (which company, which deal), ask before changing anything.
- Every change is shown to the user for a Yes/No approval before it is saved. If they say no, don't make it again unless they ask. After changing data, say briefly what you changed.

Style: answer in the user's language (English unless they write another language), short and practical. Plain text with short paragraphs and "- " bullet lists; no tables, no headings, no bold markers. Use company and contact names exactly as in the data.`;

function deskSnapshot() {
  const q = queue(), L = [], sm = CFG.semester;
  L.push(`Today: ${todayIso()}. Semester: ${sm.name || "not set"}${sm.start ? ` (${sm.start} to ${sm.end})` : ""}; cash target: ${sm.target ? sm.target + " DKK" : "not set"}.`);
  L.push(`Team: ${CFG.team.map(t => t.name + (t.active === false ? " (left)" : "")).join(", ") || "none"}. The user is: ${me() || "unknown"}.`);
  L.push(`Packages: ${CFG.packages.map(p => `${p.name} ${p.price} DKK`).join(", ") || "none set"}.`);
  L.push("", "WORK QUEUE:");
  q.renewals.forEach(x => L.push(`- Renewal due: ${co(x.o.co).name}, renewal date ${x.o.renewalDate}, satisfaction ${x.o.satisfaction || "Unknown"}`));
  q.follow.forEach(x => L.push(`- ${x.flag}: ${co(x.o.co).name} (${x.o.type}, ${x.o.stage}), next action: ${x.o.next || "none"}, due ${x.o.due || "none"}, owner ${x.o.owner || "none"}`));
  q.prio.forEach(c => L.push(`- Priority prospect without a deal: ${c.name}. Suggested first step: ${suggestion(c)}`));
  q.paths.forEach(c => L.push(`- Path in progress since ${c.path.started}: ${c.name}: ${c.path.action}`));
  q.cands.forEach(c => L.push(`- Path candidate: ${c.name}`));
  q.quick.forEach(c => L.push(`- Quick win for a need: ${c.name}: ${c.need}`));
  if (L[L.length - 1] === "WORK QUEUE:") L.push("- nothing");
  L.push("", "COMPANIES (name | quadrant | Fit total (F1/F2/F3/F4/F5) | Access | owner | last contact | open deals | notes):");
  S.companies.forEach(c => {
    const f = c.fit, a = access(c);
    const open = oppsOf(c.id).filter(isOpen).map(o => `${o.type} ${o.stage}`).join(", ") || "none";
    const notes = [c.need && "need: " + c.need, c.path && "path: " + c.path.action, c.intro && "intro: " + c.intro, checks(c).length && "checks: " + checks(c).join(", ")].filter(Boolean).join("; ");
    L.push(`- ${c.name} | ${quadrant(c)} | Fit ${fit(c) ?? "incomplete"} (${[f.f1[0], f.f2[0], f.f3[0], f4(c), f.f5[0]].map(v => v ?? "?").join("/")}) | Access ${a.level} ${ACCESS_NAMES[a.level]} | owner ${c.owner || "none"} | last contact ${lastContact(c.id) || "never"} | open deals: ${open}${notes ? " | " + notes : ""}`);
  });
  if (!S.companies.length) L.push("- no companies yet");
  let s = L.join("\n");
  if (s.length > 60000) s = s.slice(0, 60000) + "\n... (list cut short: use get_company for details)";
  return s;
}

function companyDetail(c) {
  const R = k => ({ rating: c.fit[k][0], reason: c.fit[k][1], source: c.fit[k][2] });
  return {
    name: c.name, industry: c.industry, size: c.size, website: c.website || "", owner: c.owner, quadrant: quadrant(c), fit: fit(c),
    access: access(c), suggestedFirstStep: suggestion(c), checks: checks(c), doNotContact: c.dnc,
    ratings: { F1: R("f1"), F2: R("f2"), F3: R("f3"), F4_derived: f4(c), F5: R("f5") },
    introPath: c.intro, specificNeed: c.need, path: c.path,
    commercialEvidence: c.commercial.map(e => ({ type: e.type, description: e.desc, source: e.src, amount: e.amount, year: e.year })),
    contacts: c.contacts.map(p => ({ name: p.name, title: p.title, role: p.role, relationship: p.rel, cbsAlumnus: p.alumni, source: p.source, verified: p.verified, leftCompany: !!p.left, doNotContact: !!p.dnc })),
    evidence: c.evidence.map(e => ({ about: e.crit, statement: e.text, label: e.label, source: e.src, reasoning: e.reasoning, uncheckedAIDraft: !!(e.ai && !e.checked) })),
    deals: oppsOf(c.id).map(o => ({ type: o.type, stage: o.stage, kind: o.kind, owner: o.owner, contact: o.contact, nextAction: o.next, due: o.due, package: o.pkg, proposedDKK: o.proposed, agreedDKK: o.agreed, nonCash: o.noncash, renewalDate: o.renewalDate, satisfaction: o.satisfaction, lostReason: o.lost, flag: oppFlag(o) })),
    contactLog: S.interactions.filter(i => i.co === c.id).sort((x, y) => y.date.localeCompare(x.date)).slice(0, 15)
      .map(i => ({ date: i.date, contact: i.contact, by: i.by, channel: i.channel, direction: i.dir, outcome: i.outcome, summary: i.summary })),
  };
}

/* tool helpers */
const str = v => v == null ? "" : String(v).trim();
const oneOf = (v, list, label) => { const s = str(v); if (!s) return ""; const hit = list.find(x => x.toLowerCase() === s.toLowerCase()); if (!hit) throw new Error(`${label} must be one of: ${list.join(", ")}`); return hit; };
const isoDate = (v, label) => { const s = str(v); if (!s) return ""; if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) throw new Error(`${label} must be a date as yyyy-mm-dd`); return s; };
function findCompany(name) {
  const n = str(name).toLowerCase(); if (!n) throw new Error("Say which company.");
  const exact = S.companies.filter(c => c.name.toLowerCase() === n); if (exact.length === 1) return exact[0];
  const part = S.companies.filter(c => c.name.toLowerCase().includes(n) || n.includes(c.name.toLowerCase().replace(/ \(example\)$/, "")));
  if (part.length === 1) return part[0];
  if (!part.length) throw new Error(`No company called "${name}" in the desk.`);
  throw new Error(`Several companies match "${name}": ${part.map(c => c.name).join(", ")}. Ask the user which one.`);
}
function findDeal(c, type, openOnly) {
  let list = oppsOf(c.id); if (type) list = list.filter(o => o.type.toLowerCase() === str(type).toLowerCase());
  const open = list.filter(isOpen); if (openOnly || open.length) list = open.length ? open : list;
  if (list.length === 1) return list[0];
  if (!list.length) throw new Error(`${c.name} has no ${type ? type + " " : ""}deal${openOnly ? " in progress" : ""}.`);
  throw new Error(`${c.name} has several deals (${list.map(o => o.type + " " + o.stage).join(", ")}). Ask which one, then pass deal_type.`);
}
const note = text => { const m = CHAT.msgs[CHAT.msgs.length - 1]; if (m && m.role === "ai") { m.acts.push(text); schedule(); } };
const canEditData = () => { if (!canWrite || !DB) throw new Error("This view can't change data (read-only or not connected)."); };

async function applyStage(o, stage, extra) {
  const c = co(o.co);
  const body = { ...bodyOf(o), ...extra, stage };
  if (["Won", "Lost"].includes(stage)) { body.closed = todayIso(); body.next = ""; body.due = ""; }
  if (stage === "Won" && !body.satisfaction) body.satisfaction = "Unknown";
  if (stage === "Nurture") { body.next = "Revisit"; body.due = body.nurtureUntil; }
  await put("opps", o.id, body);
  const year = String(TODAY.getFullYear());
  if (stage === "Won" && body.kind === "Cash" && body.agreed && !c.commercial.some(e => e.type === "Previous CBS Talks spend" && e.year === year && e.opp === o.id))
    await patch("companies", c.id, { commercial: [...clone(c.commercial), { k: rid(), type: "Previous CBS Talks spend", desc: `${body.type} agreed`, amount: body.agreed, year, opp: o.id, on: todayIso(), by: me() }] });
}
