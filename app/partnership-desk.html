<title>CBS Talks Partnership Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;650;700&family=Newsreader:opsz,wght@6..72,500&display=swap">
<style>
/* Partnership Desk (live). Source for app/partnership-desk.html: rebuild with python3 tools/build_app.py.
   Layout: a navy masthead (logo, title, tabs) over a quiet working surface; one view at a time;
   companies open in a side sheet; on phones the tabs move to a bottom bar. */
:root {
  --bg: #f4f5f8; --surface: #ffffff; --surface-2: #f2f4f8; --surface-3: #e9ecf3;
  --ink: #141b33; --ink-2: #3a4361; --muted: #646d88; --line: #e3e6ee; --line-strong: #cfd4e2;
  --navy: #1b2a53; --navy-2: #26386c; --on-navy: #ffffff; --on-navy-muted: #b7c1df;
  --gold: #c8972f; --gold-soft: #f7eedb;
  --accent: #1b2a53; --accent-ink: #ffffff; --accent-soft: #e8ecf6;
  --crit: #b5443e; --crit-bg: #fbecea; --warn: #8f6210; --warn-bg: #fbf0d9; --good: #2c7a57; --good-bg: #e4f2eb; --info: #3c4f86; --info-bg: #eaeef8;
  --q-priority: #1b2a53; --q-path: #4f69ad; --q-quick: #2c7a57; --q-low: #8d93a7;
  --dot: #1b2a53;
  --shadow-sm: 0 1px 2px rgb(20 27 51 / 0.05);
  --shadow: 0 1px 2px rgb(20 27 51 / 0.04), 0 8px 24px rgb(20 27 51 / 0.05);
  --shadow-lg: 0 24px 64px rgb(10 15 35 / 0.24);
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-body: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --r-lg: 14px; --r: 10px; --r-sm: 7px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1122; --surface: #131a30; --surface-2: #182039; --surface-3: #1f2945;
    --ink: #e8ebf4; --ink-2: #c3c9da; --muted: #9aa2bb; --line: #242e4a; --line-strong: #34405f;
    --navy: #0f1733; --navy-2: #1b2648; --on-navy: #ffffff; --on-navy-muted: #9fabcf;
    --gold: #e0b25a; --gold-soft: #33291a;
    --accent: #e0b25a; --accent-ink: #141a2e; --accent-soft: #252f4d;
    --crit: #f0918a; --crit-bg: #3a1e24; --warn: #e8b65c; --warn-bg: #362b16; --good: #72cfa2; --good-bg: #163528; --info: #aab9e9; --info-bg: #1f2a4a;
    --q-priority: #aab9e9; --q-path: #7f97dc; --q-quick: #72cfa2; --q-low: #8d93a7;
    --dot: #e0b25a;
    --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.3); --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 8px 24px rgb(0 0 0 / 0.25); --shadow-lg: 0 24px 64px rgb(0 0 0 / 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1122; --surface: #131a30; --surface-2: #182039; --surface-3: #1f2945;
  --ink: #e8ebf4; --ink-2: #c3c9da; --muted: #9aa2bb; --line: #242e4a; --line-strong: #34405f;
  --navy: #0f1733; --navy-2: #1b2648; --on-navy: #ffffff; --on-navy-muted: #9fabcf;
  --gold: #e0b25a; --gold-soft: #33291a;
  --accent: #e0b25a; --accent-ink: #141a2e; --accent-soft: #252f4d;
  --crit: #f0918a; --crit-bg: #3a1e24; --warn: #e8b65c; --warn-bg: #362b16; --good: #72cfa2; --good-bg: #163528; --info: #aab9e9; --info-bg: #1f2a4a;
  --q-priority: #aab9e9; --q-path: #7f97dc; --q-quick: #72cfa2; --q-low: #8d93a7;
  --dot: #e0b25a;
  --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.3); --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 8px 24px rgb(0 0 0 / 0.25); --shadow-lg: 0 24px 64px rgb(0 0 0 / 0.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 500; font-size: 2rem; letter-spacing: -0.01em; line-height: 1.15; }
h3 { font-size: 0.98rem; font-weight: 650; letter-spacing: -0.005em; }
a { color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.84rem; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.ico { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* masthead */
.masthead { background: var(--navy); color: var(--on-navy); padding-top: env(safe-area-inset-top, 0px); position: sticky; top: 0; z-index: 30; }
.mast-inner { max-width: 1240px; margin: 0 auto; padding-inline: 20px; }
.mast-top { display: flex; align-items: center; gap: 14px; padding-block: 14px 10px; }
.mast-top img { width: 42px; height: 42px; display: block; border-radius: 6px; }
.brand-title { display: grid; gap: 0; min-width: 0; }
.brand-title h1 { font-family: var(--font-display); font-weight: 500; font-size: 1.45rem; letter-spacing: 0; line-height: 1.15; }
.brand-title span { font-size: 0.8rem; color: var(--on-navy-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mast-right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.status { display: inline-flex; align-items: center; gap: 7px; color: var(--on-navy-muted); font-size: 0.78rem; font-weight: 600; white-space: nowrap; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #9fb0dd; }
.status.live::before { background: #4fd39a; box-shadow: 0 0 0 3px rgb(79 211 154 / 0.18); }
.status.off::before { background: #f08a8a; }
.qs-open { display: inline-flex; align-items: center; gap: 8px; background: rgb(255 255 255 / 0.08); border: 1px solid rgb(255 255 255 / 0.14); color: var(--on-navy); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 0.82rem; font-weight: 600; }
.qs-open:hover { background: rgb(255 255 255 / 0.14); }
.qs-open kbd { font-family: var(--font-body); font-size: 0.72rem; color: var(--on-navy-muted); border: 1px solid rgb(255 255 255 / 0.2); border-radius: 5px; padding: 0 5px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tab { background: none; border: 0; color: var(--on-navy-muted); padding: 10px 12px 12px; cursor: pointer; font-weight: 600; font-size: 0.9rem; white-space: nowrap; display: inline-flex; gap: 7px; align-items: center; position: relative; }
.tab:hover { color: var(--on-navy); }
.tab[aria-selected="true"] { color: var(--on-navy); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--gold); }
.tab .ico { width: 17px; height: 17px; opacity: 0.85; }
.tab .count { background: var(--crit); color: #fff; border-radius: 999px; min-width: 18px; padding: 0 6px; font-size: 0.7rem; font-weight: 700; line-height: 18px; text-align: center; }

main { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 30px 70px; display: grid; gap: 20px; }
.view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.view-head p { margin: 6px 0 0; color: var(--muted); max-width: 68ch; }
.eyebrow { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
footer { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 0 36px; color: var(--muted); font-size: 0.78rem; }

/* surfaces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.section { padding: 18px 20px; display: grid; gap: 12px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.section-head h3 { display: flex; align-items: center; gap: 10px; }
.step { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line-strong); color: var(--ink-2); font-size: 0.76rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.count-chip { color: var(--muted); font-weight: 600; font-size: 0.85rem; }
.notice { padding: 16px 18px; display: grid; gap: 6px; border-left: 3px solid var(--gold); }
.notice p { margin: 0; }
.empty { color: var(--muted); padding: 4px 0; font-size: 0.92rem; }
.empty-hero { padding: 34px 28px; display: grid; gap: 12px; justify-items: start; }
.empty-hero h3 { font-family: var(--font-display); font-weight: 500; font-size: 1.5rem; }
.empty-hero p { margin: 0; color: var(--muted); max-width: 62ch; }
.rowbtns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.kv { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 6px 12px; font-size: 0.92rem; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border-radius: var(--r); padding: 8px 14px; font-weight: 600; font-size: 0.88rem; cursor: pointer; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); transition: background 0.12s, border-color 0.12s, transform 0.12s; white-space: nowrap; }
.btn:hover { background: var(--surface-2); border-color: var(--muted); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.12); }
.btn.small { padding: 5px 11px; font-size: 0.8rem; border-radius: var(--r-sm); }
.btn.ghost { background: transparent; box-shadow: none; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); }
.btn:disabled { opacity: 0.5; cursor: default; transform: none; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--muted); font-size: 0.8rem; font-weight: 600; cursor: pointer; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.linkbtn:hover { color: var(--ink); text-decoration-color: currentColor; }
.linkbtn[data-armed] { color: var(--crit); text-decoration-color: currentColor; }
.seg-toggle { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 3px; gap: 2px; }
.seg-toggle button { border: 0; background: none; border-radius: var(--r-sm); padding: 5px 12px; font-weight: 600; font-size: 0.84rem; color: var(--muted); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.seg-toggle button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.search { border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r); padding: 8px 12px; min-width: 200px; flex: 1 1 220px; max-width: 340px; }
.filter { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-weight: 600; font-size: 0.82rem; color: var(--ink-2); }
.filter:hover { border-color: var(--line-strong); }
.filter[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-weight: 600; font-size: 0.86rem; color: var(--ink); }
.chip:hover { border-color: var(--line-strong); background: var(--surface-2); }
.chip:disabled { opacity: 0.5; cursor: default; }
.chip .sc { color: var(--muted); font-weight: 500; font-size: 0.78rem; }
.switch { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px 4px 4px; font-weight: 600; font-size: 0.84rem; cursor: pointer; white-space: nowrap; color: var(--ink); }
.switch .knob { width: 34px; height: 20px; border-radius: 999px; background: var(--surface-3); position: relative; flex: none; }
.switch .knob::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); }
.switch[aria-checked="true"] .knob { background: var(--good); }
.switch[aria-checked="true"] .knob::after { left: 16px; background: #fff; }
.switch:disabled { opacity: 0.5; cursor: default; }
textarea:disabled { opacity: 0.55; }

/* status pills: a dot + word, never colour alone */
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px 2px 8px; font-size: 0.76rem; font-weight: 650; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.crit { background: var(--crit-bg); color: var(--crit); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.info { background: var(--info-bg); color: var(--info); }
.pill.good { background: var(--good-bg); color: var(--good); }
.pill.plain { background: var(--surface-2); color: var(--ink-2); }
.qpill { display: inline-flex; align-items: center; gap: 7px; font-size: 0.8rem; font-weight: 600; white-space: nowrap; color: var(--ink-2); }
.qpill::before { content: ""; width: 9px; height: 9px; border-radius: 3px; background: var(--qc, var(--q-low)); }
.qpill.Priority { --qc: var(--q-priority); }
.qpill.Build { --qc: var(--q-path); }
.qpill.Quick { --qc: var(--q-quick); }
.qpill.Low, .qpill.Research { --qc: var(--q-low); }
.qpill.Do { --qc: var(--crit); }

/* work queue rows */
.qrow { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 2fr) auto; gap: 16px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); }
.qrow:first-of-type { border-top: 0; padding-top: 4px; }
.co { font-weight: 650; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; font-size: 0.98rem; color: var(--ink); }
.co:hover { text-decoration: underline; text-underline-offset: 3px; }
.meta { color: var(--muted); font-size: 0.84rem; }
.qrow .actions { display: flex; gap: 10px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
@media (max-width: 760px) { .qrow { grid-template-columns: minmax(0, 1fr); gap: 6px; } .qrow .actions { justify-content: flex-start; } }

/* fit + access */
.fitbar { display: inline-flex; align-items: center; gap: 8px; }
.fitbar .track { width: 64px; height: 6px; background: var(--surface-3); border-radius: 3px; overflow: hidden; }
.fitbar .fill { height: 100%; background: var(--dot); border-radius: 3px; }
.ladder { display: inline-flex; gap: 3px; vertical-align: middle; }
.ladder i { width: 10px; height: 6px; border-radius: 2px; background: var(--surface-3); }
.ladder i.on { background: var(--q-quick); }

/* companies table */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
th { text-align: left; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; padding: 12px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--surface-2); }

/* Fit × Access chart */
.chart-card { padding: 18px 20px 14px; display: grid; gap: 10px; }
.chart-wrap { position: relative; overflow-x: auto; }
.chart-wrap svg { display: block; width: 100%; min-width: 560px; height: auto; }
.chart-wrap .grid line { stroke: var(--line); stroke-width: 1; }
.chart-wrap .axis text, .chart-wrap .axis-title { fill: var(--muted); font-size: 11.5px; font-family: var(--font-body); }
.chart-wrap .axis-title { font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; font-size: 10.5px; }
.chart-wrap .region { stroke: none; }
.chart-wrap .r-priority { fill: var(--q-priority); fill-opacity: 0.07; }
.chart-wrap .r-path { fill: var(--q-path); fill-opacity: 0.06; }
.chart-wrap .r-quick { fill: var(--q-quick); fill-opacity: 0.07; }
.chart-wrap .r-low { fill: var(--q-low); fill-opacity: 0.05; }
.chart-wrap .region-label { fill: var(--ink-2); font-size: 12px; font-weight: 700; font-family: var(--font-body); }
.chart-wrap .region-sub { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.chart-wrap .divider { stroke: var(--line-strong); stroke-dasharray: 4 4; }
.chart-wrap .dot { fill: var(--dot); stroke: var(--surface); stroke-width: 2; cursor: pointer; }
.chart-wrap .dot-hit { fill: transparent; cursor: pointer; }
.chart-wrap g.pt:hover .dot, .chart-wrap g.pt:focus .dot { fill: var(--gold); }
.chart-wrap g.pt:focus { outline: none; }
.chart-wrap .more { fill: var(--muted); font-size: 11px; font-weight: 700; font-family: var(--font-body); }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: var(--r-sm); padding: 7px 10px; font-size: 0.8rem; line-height: 1.35; box-shadow: var(--shadow); white-space: nowrap; z-index: 2; transform: translate(-50%, calc(-100% - 12px)); }
.tip b { font-weight: 700; }

/* pipeline */
.board { display: grid; grid-template-columns: repeat(8, minmax(136px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 8px; }
.col { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 10px; display: grid; gap: 8px; align-content: start; min-height: 260px; transition: background 0.12s, border-color 0.12s; }
.col.drop-hover { background: var(--accent-soft); border-color: var(--accent); }
.col h3 { font-size: 0.7rem; display: flex; justify-content: space-between; gap: 6px; padding: 4px 4px 6px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); }
.deal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; overflow-wrap: anywhere; display: grid; gap: 6px; box-shadow: var(--shadow-sm); cursor: grab; }
.deal:hover { border-color: var(--line-strong); }
.deal.dragging { opacity: 0.5; }
.deal .t { font-weight: 650; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; color: var(--ink); }
.deal .t:hover { text-decoration: underline; text-underline-offset: 3px; }
.deal select { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 3px 6px; font-size: 0.78rem; color: var(--muted); }
.deal .foot { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; }
.deal .foot select { min-width: 0; width: 100%; }

/* dashboard */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.kpi { padding: 18px 20px; display: grid; gap: 6px; align-content: start; }
.kpi .label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
.kpi .value { font-family: var(--font-display); font-size: 2rem; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.1; }
.meter { height: 6px; background: var(--surface-3); border-radius: 3px; overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--gold); border-radius: 3px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 860px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.bars { display: grid; gap: 9px; }
.barrow { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 12px; align-items: center; font-size: 0.86rem; }
.barrow .tr { position: relative; height: 16px; }
.barrow .b { height: 16px; background: var(--dot); border-radius: 0 4px 4px 0; min-width: 2px; }
.barrow .b.zero { background: var(--line-strong); }
.barrow .v { position: absolute; top: 0; line-height: 16px; padding-left: 8px; font-size: 0.8rem; font-weight: 700; color: var(--ink-2); }
.list { display: grid; }
.li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.li:first-child { border-top: 0; padding-top: 2px; }

/* company sheet */
.scrim { position: fixed; inset: 0; background: rgb(8 12 28 / 0.45); z-index: 40; backdrop-filter: blur(2px); }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(660px, 100%); background: var(--bg); z-index: 50; overflow-y: auto; box-shadow: var(--shadow-lg); padding-top: env(safe-area-inset-top, 0px); }
.drawer-head { background: var(--navy); color: var(--on-navy); padding: 20px 22px 0; display: grid; gap: 14px; position: sticky; top: 0; z-index: 2; }
.drawer-head .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.drawer-head h2 { font-size: 1.75rem; color: var(--on-navy); }
.drawer-head .sub { color: var(--on-navy-muted); font-size: 0.84rem; margin-top: 4px; }

  f2: ["F2 Content fit", "Do they have a story or person for our themes?", "No link to any current theme", "A relevant topic, but no named speaker or concrete idea", "A named person or a concrete event idea that fits a current theme"],
  f3: ["F3 Reason to work with us", "What's in it for them?", "Checked: nothing we offer helps them", "Some hiring of business profiles or some interest in our topics", "Clear, recurring hiring of CBS-type profiles, or an active public agenda on one of our themes"],
  f5: ["F5 Long-term potential", "Could this repeat?", "One-off reason only", "Could plausibly repeat", "A recurring need across years, or a past multi-year partnership"],
};

function withKeys(list) { return (list || []).map((x, i) => x && x.k ? x : { ...x, k: "i" + i }); }
function normCompany(id, d) {
  const fit = d.fit || {};
  const f = k => Array.isArray(fit[k]) ? [fit[k][0] ?? null, fit[k][1] || "", fit[k][2] || ""] : [null, "", ""];
  return { ...d, id, name: d.name || "(no name)", industry: d.industry || "Other", size: d.size || "Unknown", owner: d.owner || "",
    fit: { f1: f("f1"), f2: f("f2"), f3: f("f3"), f5: f("f5") }, intro: d.intro || "", need: d.need || "", path: d.path || null, dnc: !!d.dnc,
    commercial: withKeys(d.commercial), contacts: withKeys(d.contacts), evidence: withKeys(d.evidence) };
}
const bodyOf = x => { const b = clone(x); delete b.id; return b; };

/* ---------- rules (lean spec §2–§3) ---------- */
const co = id => S.companies.find(c => c.id === id);
const oppsOf = id => S.opps.filter(o => o.co === id);
const isOpen = o => OPEN.includes(o.stage);
const teamActive = n => { const t = CFG.team.find(t => t.name === n); return !t || t.active !== false; };

function f4(c) {
  const t = c.commercial.map(e => e.type);
  if (!t.length) return null;
  if (t.includes("Previous CBS Talks spend") || t.includes("Sponsors student organisations")) return 2;
  if (t.some(x => ["Sponsors university activities", "Sponsors similar events", "Previous CBS Talks partner"].includes(x))) return 1;
  return 0;
}
function fit(c) {
  const v = [c.fit.f1[0], c.fit.f2[0], c.fit.f3[0], f4(c), c.fit.f5[0]];
  return v.some(x => x == null) ? null : v.reduce((a, b) => a + b, 0);
}
function access(c) {
  const contacts = c.contacts.filter(p => !p.left && !p.dnc);
  const champ = contacts.find(p => p.rel === "Champion");
  if (champ) return { level: 4, why: `${champ.name}${champ.title ? " (" + champ.title + ")" : ""} is a champion` };
  const sat = oppsOf(c.id).find(o => o.stage === "Won" && o.satisfaction === "Satisfied");
  if (sat) return { level: 4, why: "Satisfied past partner" };
  const warm = S.interactions.filter(i => i.co === c.id && i.outcome === "Positive" && days(i.date, todayIso()) <= SET.warmDays
    && contacts.some(p => p.name === i.contact)).sort((a, b) => b.date.localeCompare(a.date))[0];
  if (warm) return { level: 3, why: `${warm.contact} responded positively on ${fmt(warm.date)}` };
  if (c.intro) return { level: 2, why: c.intro };
  const named = contacts.find(p => !NOT_SUITABLE.includes(p.role));
  if (named) return { level: 1, why: `${named.name}${named.title ? ", " + named.title : ""}` };
  return { level: 0, why: "No named contact and no introduction route yet" };
}
function quadrant(c) {
  if (c.dnc) return "Do not contact";
  const f = fit(c), a = access(c).level;
  if (f == null) return "Research";
  if (f >= SET.fitHigh && a >= SET.accessHigh) return "Priority";
  if (f >= SET.fitHigh) return "Build a Path";
  if (a >= SET.accessHigh) return "Quick Win";
  return "Low Priority";
}
const qClass = q => q.split(" ")[0];
function lastContact(id) { return S.interactions.filter(i => i.co === id).map(i => i.date).sort().pop() || ""; }
function oppFlag(o) {
  const t = todayIso();
  if (o.stage === "Won" && o.renewalDate && days(t, o.renewalDate) <= SET.renewalDays
    && !S.opps.some(x => x.co === o.co && x.renewal && isOpen(x))) return "Renewal due";
  if (!isOpen(o)) return "";
  if (!o.next || !o.due) return "Missing next action";
  if (days(t, o.due) < 0) return "Overdue";
  if (o.stage === "Contacted") {
    const ints = S.interactions.filter(i => i.co === o.co);
    const sent = ints.filter(i => i.dir === "Sent by us").map(i => i.date).sort().pop();
    const recv = ints.filter(i => i.dir !== "Sent by us").map(i => i.date).sort().pop() || "";
    if (sent && days(sent, t) >= SET.noReplyDays && recv < sent) return "No reply";
  }
  if (days(t, o.due) <= 7) return "Due this week";
  return "";
}
function suggestion(c) {
  const ren = oppsOf(c.id).find(o => oppFlag(o) === "Renewal due");
  if (ren) return ren.satisfaction === "Satisfied" ? `Renewal: propose the same package${ren.pkg ? " (" + ren.pkg + ")" : ""} or one level up.` : "Renewal: propose the same package and ask what would make it more valuable.";
  const a = access(c).level, f = f4(c), out = [];
  if (c.fit.f2[0] === 2) out.push("Speaker (cheapest first step)");
  if (c.fit.f3[0] === 2) out.push("Recruitment event or case workshop");
  if (f === 2 && a >= 3) out.push("Sponsorship package");
  if (c.need) out.push(`In-kind / specific need: ${c.need}`);
  if (!out.length) return "Nothing on the cheat sheet fits yet. Don't approach now.";
  const money = a < 3 ? " No cash ask in the first contact (Access below Warm)." : "";
  return out.join(" · ") + "." + money;
}
function checks(c) {
  const out = [];
  if (!c.owner) out.push("No owner");
  else if (!teamActive(c.owner)) out.push("Needs new owner");
  ["f1", "f2", "f3", "f5"].forEach(k => { if (c.fit[k][0] === 2 && !c.fit[k][2]) out.push("Source missing for a 2"); });
  if (c.contacts.some(p => !p.left && (!p.verified || days(p.verified, todayIso()) > SET.recheckDays))) out.push("Re-check contact");
  if (c.evidence.some(e => e.ai && !e.checked)) out.push("Unchecked AI evidence");
  if (!c.commercial.length) out.push("Add commercial evidence");
  if (oppsOf(c.id).some(o => o.stage === "Won" && o.satisfaction === "Unknown" && o.end && o.end < todayIso())) out.push("Record satisfaction");
  return [...new Set(out)];
}

/* ---------- work queue (§3.5) ---------- */
function queue() {
  const order = { "Renewal due": 1, "Overdue": 2, "No reply": 3, "Due this week": 4, "Missing next action": 5 };
  const deals = S.opps.filter(o => co(o.co)).map(o => ({ o, flag: oppFlag(o) })).filter(x => x.flag)
    .sort((a, b) => order[a.flag] - order[b.flag] || ((a.flag === "Renewal due" ? a.o.renewalDate : a.o.due) || "9").localeCompare((b.flag === "Renewal due" ? b.o.renewalDate : b.o.due) || "9"));
  const renewals = deals.filter(x => x.flag === "Renewal due");
  const follow = deals.filter(x => x.flag !== "Renewal due");
  const sortFit = (a, b) => fit(b) - fit(a) || access(b).level - access(a).level;
  const prio = S.companies.filter(c => quadrant(c) === "Priority" && !oppsOf(c.id).some(isOpen) && !oppsOf(c.id).some(o => oppFlag(o) === "Renewal due")).sort(sortFit);
  const paths = S.companies.filter(c => c.path && !c.dnc).sort((a, b) => (a.path.started || "").localeCompare(b.path.started || ""));
  const quick = S.companies.filter(c => quadrant(c) === "Quick Win" && c.need && !oppsOf(c.id).some(isOpen)).sort(sortFit);
  const room = SET.pathCap - paths.length;
  const cands = room > 0 ? S.companies.filter(c => quadrant(c) === "Build a Path" && !c.path).sort(sortFit).slice(0, room) : [];
  return { renewals, follow, prio, paths, quick, cands };
}

/* ---------- database writes ---------- */
function errText(e) {
  const c = e && e.code;
  if (c === "offline") return "Not connected. Open the shared link in claude.ai to save changes.";
  if (c === "invalid_argument") { canWrite = false; schedule(); return "This change wasn't saved. You may only have view access: ask the Partnerships Manager to make you a Contributor."; }
  if (c === "quota_exceeded") return "The shared database is full. Remove example data or old entries, then try again.";
  if (c === "resource_exhausted") return "Too many changes at once. Wait a few seconds and try again.";
  if (c === "revoked") return "Your access to this page changed. Reload the page.";
  return "Couldn't save. Check your connection and try again.";
}
async function run(fn) {
  if (!DB) throw { code: "offline" };
  try { return await fn(); } catch (e) {
    if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 400 + Math.random() * 600)); return await fn(); }
    throw e;
  }
}
/* each write waits (briefly) until the change is back in the page's own state, so the next step sees it */
const snapVer = { companies: 0, opps: 0, interactions: 0, config: 0, events: 0 };
async function synced(col, fn) {
  const v = snapVer[col]; await run(fn);
  for (let i = 0; i < 30 && snapVer[col] === v; i++) await new Promise(r => setTimeout(r, 50));
}
const put = (col, id, body) => { capture(col, id); return synced(col, () => DB.collection(col).doc(id).set(body)); };
const patch = (col, id, body) => { capture(col, id); return synced(col, () => DB.collection(col).doc(id).update(body)); };
const del = (col, id) => { capture(col, id); return synced(col, () => DB.collection(col).doc(id).delete()); };
async function act(fn, ok) { beginTx(); try { await fn(); if (ok) toast(ok); } catch (e) { toast(errText(e)); } finally { endTx(); } }

/* ---------- Companies: list or Fit × Access chart ---------- */
function fitAccessChart(list) {
  const W = 760, H = 430, L = 46, R = 14, T = 14, B = 52;
  const cw = (W - L - R) / 5, ph = H - T - B;
  const x = a => L + cw * (a + 0.5), y = f => T + ph * (1 - (f + 1.2) / 12.4);
  const cells = {};
  list.forEach(c => { const k = access(c).level + ":" + fit(c); (cells[k] = cells[k] || []).push(c); });
  const xb = L + cw * 2, yb = y(5.5);
  const regions = `
    <rect class="region r-path" x="${L}" y="${T}" width="${xb - L}" height="${yb - T}"/>
    <rect class="region r-priority" x="${xb}" y="${T}" width="${W - R - xb}" height="${yb - T}"/>
    <rect class="region r-low" x="${L}" y="${yb}" width="${xb - L}" height="${T + ph - yb}"/>
    <rect class="region r-quick" x="${xb}" y="${yb}" width="${W - R - xb}" height="${T + ph - yb}"/>
    <line class="divider" x1="${xb}" x2="${xb}" y1="${T}" y2="${T + ph}"/><line class="divider" x1="${L}" x2="${W - R}" y1="${yb}" y2="${yb}"/>
    <text class="region-label" x="${L + 10}" y="${T + 20}">Build a Path <tspan class="region-sub" dx="4">${S.companies.filter(c => c.path && !c.dnc).length} of ${SET.pathCap} paths in progress</tspan></text>
    <text class="region-label" x="${W - R - 10}" y="${T + 20}" text-anchor="end">Priority</text>
    <text class="region-label" x="${L + 10}" y="${T + ph - 11}">Low Priority</text>
    <text class="region-label" x="${W - R - 10}" y="${T + ph - 12}" text-anchor="end">Quick Win</text>`;
  const grid = [0, 2, 4, 6, 8, 10].map(f => `<line x1="${L}" x2="${W - R}" y1="${y(f)}" y2="${y(f)}"/>`).join("");
  const yTicks = [0, 2, 4, 6, 8, 10].map(f => `<text x="${L - 10}" y="${y(f) + 4}" text-anchor="end">${f}</text>`).join("");
  const short = ["No path", "Named", "Intro", "Warm", "Champion"];
  const xTicks = short.map((n, a) => `<text x="${x(a)}" y="${T + ph + 18}" text-anchor="middle">${a} · ${n}</text>`).join("");
  let dots = "";
  Object.entries(cells).forEach(([k, cs]) => {
    const [a, f] = k.split(":").map(Number);
    const per = 7, shown = cs.slice(0, 14), sp = 17;
    shown.forEach((c, i) => {
      const row = Math.floor(i / per), inRow = Math.min(per, shown.length - row * per), col = i % per;
      const cx = x(a) + (col - (inRow - 1) / 2) * sp, cy = y(f) + (row === 0 ? (shown.length > per ? -8 : 0) : 8);
      dots += `<g class="pt" tabindex="0" role="button" data-open="${c.id}" data-tip="${esc(c.name)}|Fit ${f} · Access ${a} · ${esc(quadrant(c))}" aria-label="${esc(c.name)}, Fit ${f}, Access ${a}">
        <circle class="dot-hit" cx="${cx}" cy="${cy}" r="11"/><circle class="dot" cx="${cx}" cy="${cy}" r="6.5"/></g>`;
    });
    if (cs.length > shown.length) dots += `<text class="more" x="${x(a) + cw / 2 - 6}" y="${y(f) + 4}" text-anchor="end">+${cs.length - shown.length}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Companies by Fit and Access">
    ${regions}<g class="grid">${grid}</g><g class="axis">${yTicks}${xTicks}</g>
    <text class="axis-title" x="${L}" y="${H - 8}">Access →</text>
    <text class="axis-title" transform="translate(12 ${T + ph / 2}) rotate(-90)" text-anchor="middle">Fit</text>
    ${dots}</svg>`;
}

/* ---------- Dashboard ---------- */
function viewDashboard() {
  const sm = CFG.semester, hasSem = sm.start && sm.end;
  const opps = S.opps.filter(o => co(o.co));
  const sem = o => hasSem && o.closed && o.closed >= sm.start && o.closed <= sm.end;
  const wonSem = opps.filter(o => o.stage === "Won" && sem(o));
  const lostSem = opps.filter(o => o.stage === "Lost" && sem(o));
  const cashWon = wonSem.filter(o => o.kind === "Cash").reduce((s, o) => s + (Number(o.agreed) || 0), 0);
  const proposed = opps.filter(o => ["Proposal sent", "Negotiation"].includes(o.stage) && o.kind === "Cash").reduce((s, o) => s + (Number(o.proposed) || 0), 0);
  const target = Number(sm.target) || 0;
  const pct = target ? Math.min(cashWon / target, 1) : 0;
  const stageCounts = OPEN.concat(["Nurture"]).map(s => [s, opps.filter(o => o.stage === s).length]);
  const maxC = Math.max(1, ...stageCounts.map(x => x[1]));
  const quads = ["Priority", "Build a Path", "Quick Win", "Low Priority", "Research", "Do not contact"].map(q => [q, S.companies.filter(c => quadrant(c) === q).length]);
  const health = [
    ["Open deals without a next action", opps.filter(o => oppFlag(o) === "Missing next action").length],
    ["Companies without an owner", S.companies.filter(c => !c.owner).length],
    ["Items with an owner who left", S.companies.filter(c => c.owner && !teamActive(c.owner)).length + opps.filter(o => isOpen(o) && o.owner && !teamActive(o.owner)).length],
    ["Contacts to re-check (> 6 months)", S.companies.flatMap(c => c.contacts).filter(p => !p.left && (!p.verified || days(p.verified, todayIso()) > SET.recheckDays)).length],
    ["Unchecked AI evidence", S.companies.flatMap(c => c.evidence).filter(e => e.ai && !e.checked).length],
    ["Won deals missing satisfaction", opps.filter(o => o.stage === "Won" && o.satisfaction === "Unknown" && o.end && o.end < todayIso()).length],
    ["Partner reports to send", S.events.filter(reportDue).length],
  ];
  const noncash = opps.filter(o => o.kind !== "Cash" && o.stage !== "Lost");

  return headOf("Dashboard", "Counts and recorded amounts only: no probabilities, no expected values, no budget estimates.")
  + (hasSem ? "" : `<section class="card notice"><p><b>Set the semester dates in Settings.</b> "Won this semester" and "Lost this semester" use them.</p></section>`)
  + `<div class="kpis">
    <div class="card kpi"><span class="label">Cash won this semester</span><span class="value">${dkk(cashWon)}</span>
      ${target ? `<div class="meter" role="img" aria-label="${Math.round(pct * 100)}% of target"><span style="width:${pct * 100}%"></span></div>
      <span class="muted small">${Math.round(pct * 100)}% of the ${dkk(target)} target</span>` : `<span class="muted small">No cash target set</span>`}</div>
    <div class="card kpi"><span class="label">Proposed, not committed</span><span class="value">${dkk(proposed)}</span><span class="muted small">cash in Proposal sent and Negotiation</span></div>
    <div class="card kpi"><span class="label">Open deals</span><span class="value">${opps.filter(isOpen).length}</span><span class="muted small">${noncash.filter(isOpen).length} of them non-cash or in-kind</span></div>
    <div class="card kpi"><span class="label">Renewals due</span><span class="value">${queue().renewals.length}</span><span class="muted small">within ${SET.renewalDays} days</span></div>
  </div>
  <div class="grid2">
    <section class="card section"><div class="section-head"><h3>Open deals by stage</h3></div>
      <div class="bars">${stageCounts.map(([s, n]) => `<div class="barrow"><span>${s}</span><span class="tr"><span class="b ${n ? "" : "zero"}" style="display:block;width:${n / maxC * 85}%"></span><span class="v num" style="left:${n / maxC * 85}%">${n}</span></span></div>`).join("")}</div></section>
    <section class="card section"><div class="section-head"><h3>Companies by quadrant</h3></div>
      <div class="list">${quads.map(([q, n]) => `<div class="li">${qPill(q)}<b class="num">${n}</b></div>`).join("")}</div></section>
    <section class="card section"><div class="section-head"><h3>Won this semester</h3></div>
      <div class="list">${wonSem.map(o => `<div class="li"><span><b>${esc(co(o.co).name)}</b> <span class="muted small">${esc(o.type)} · renewal ${fmt(o.renewalDate)} · ${esc(o.satisfaction || "Unknown")}</span></span><b class="num">${o.kind === "Cash" ? dkk(o.agreed) : esc(o.noncash)}</b></div>`).join("") || `<div class="empty">None yet.</div>`}</div></section>
    <section class="card section"><div class="section-head"><h3>Lost this semester</h3></div>
      <div class="list">${lostSem.map(o => `<div class="li"><span><b>${esc(co(o.co).name)}</b> <span class="muted small">${esc(o.type)}</span></span><span class="pill plain">${esc(o.lost)}</span></div>`).join("") || `<div class="empty">None.</div>`}</div>

    <section class="card section"><div class="section-head"><h3>Data health</h3></div>
      <div class="list">${health.map(([l, n]) => `<div class="li"><span>${l}</span>${n ? `<span class="pill crit">${n}</span>` : `<span class="pill good">0</span>`}</div>`).join("")}</div></section>
  </div>`;
}

/* ---------- undo the last change ---------- */
let TX = null, UNDO = null;
const RAW = { companies: {}, opps: {}, interactions: {}, config: {}, events: {} };
function beginTx() { TX = { prev: new Map() }; }
function endTx() { if (TX && TX.prev.size) UNDO = TX; TX = null; }
function capture(col, id) { if (!TX) return; const key = col + "/" + id; if (!TX.prev.has(key)) TX.prev.set(key, RAW[col] && RAW[col][id] ? clone(RAW[col][id]) : null); }
async function performUndo() {
  const u = UNDO; if (!u) return; UNDO = null; hideToast();
  try {
    for (const [key, prev] of [...u.prev.entries()].reverse()) {
      const [col, id] = key.split("/");
      if (prev == null) await del(col, id); else await put(col, id, prev);
    }
    toast("Undone.");
  } catch (e) { toast(errText(e)); }
}

/* ---------- modals ---------- */
function modal(title, html, onSubmit, opts = {}) {
  closeModal(false);
  const host = document.createElement("div");
  host.className = "modal"; host.id = "modal";
  host.innerHTML = `<div class="scrim" data-mclose></div><form class="box" role="dialog" aria-modal="true" aria-labelledby="m-title" novalidate>
    <h3 id="m-title">${title}</h3>${html}<div class="err" id="m-err" role="alert" hidden></div>
    <div class="btns"><button type="button" class="btn" data-mclose>Cancel</button><button type="submit" class="btn primary" id="m-save">${opts.save || "Save"}</button></div></form>`;
  document.body.appendChild(host);
  const form = host.querySelector("form");
  const first = form.querySelector("input:not([type=radio]):not([type=checkbox]), select, textarea"); if (first) first.focus();
  host.addEventListener("click", e => { if (e.target.closest("[data-mclose]")) closeModal(true); });
  if (opts.onReady) opts.onReady(form);
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form).entries());
    form.querySelectorAll("input[type=checkbox]").forEach(cb => { data[cb.name] = cb.checked; });
    Object.keys(data).forEach(k => { if (typeof data[k] === "string") data[k] = data[k].trim(); });
    const btn = form.querySelector("#m-save"); btn.disabled = true;
    let err; beginTx(); try { err = await onSubmit(data); } catch (x) { err = errText(x); } finally { endTx(); }
    btn.disabled = false;
    if (err) { const el = form.querySelector("#m-err"); el.textContent = err; el.hidden = false; return; }
    closeModal(true);
  });
}
function closeModal(rerender) { const m = document.getElementById("modal"); if (m) m.remove(); if (rerender) render(); }

const inp = (name, value, extra = "") => `<input name="${name}" id="f-${name}" value="${esc(value ?? "")}" ${extra}>`;
const chk = (name, checked, label) => `<label class="check"><input type="checkbox" name="${name}" id="f-${name}" ${checked ? "checked" : ""}> ${label}</label>`;

const REQUIRE = {
  "Proposal sent": o => o.kind === "Cash" && !o.pkg && !o.proposed ? ["pkg"] : [],
  "Won": o => [...(o.kind === "Cash" && !o.agreed ? ["agreed"] : []), ...(!o.renewalDate ? ["renewalDate"] : [])],
  "Lost": o => o.lost ? [] : ["lost"],
  "Nurture": o => [...(!o.nurture ? ["nurture"] : []), ...(!o.nurtureUntil ? ["nurtureUntil"] : [])],
};
function moveStage(id, stage) {
  const o = S.opps.find(x => x.id === id); const c = co(o.co);
  const need = (REQUIRE[stage] || (() => []))(o);
  const apply = async extra => { await applyStage(o, stage, extra); toast(`${c.name} moved to ${stage}.`); };
  if (!need.length) { act(() => apply({})); return; }
  const pk = CFG.packages;
  const fields = {
    pkg: (pk.length ? field("Package", `<select name="pkg" id="f-pkg">${vopts([["", "No package"], ...pk.map(p => [p.name, `${p.name} (${dkk(p.price)})`])], "")}</select>`) : "")
      + field("Proposed value (DKK)", inp("proposed", "", 'type="number" min="0" step="500"'), pk.length ? "Leave empty to use the package price." : ""),
    agreed: field("Agreed value (DKK)", inp("agreed", o.proposed || "", 'type="number" min="0" step="500"')),
    renewalDate: field("Renewal date", inp("renewalDate", D(300), 'type="date"')),
    lost: field("Lost reason", `<select name="lost" id="f-lost">${opts(LOST_REASONS, "No budget")}</select>`),
    nurture: field("Why nurture?", inp("nurture", "", 'placeholder="e.g. budget decided in spring"')),
    nurtureUntil: field("Revisit on", inp("nurtureUntil", D(90), 'type="date"')),
  };
  modal(`Move ${esc(c.name)} to ${esc(stage)}`, `<p class="muted small" style="margin:0">This stage requires:</p>${need.map(k => fields[k]).join("")}`, async d => {
    const extra = {};
    if (need.includes("pkg")) {
      const p = pk.find(p => p.name === d.pkg);
      if (!p && !(Number(d.proposed) > 0)) return "Choose a package or enter the proposed value.";
      if (p) extra.pkg = p.name;
      extra.proposed = Number(d.proposed) > 0 ? Number(d.proposed) : p.price;
    }
    if (need.includes("agreed")) { if (!(Number(d.agreed) > 0)) return "Enter the agreed value."; extra.agreed = Number(d.agreed); }
    if (need.includes("nurture") && !d.nurture) return "Say why this is parked.";
    ["renewalDate", "lost", "nurture", "nurtureUntil"].forEach(k => { if (d[k]) extra[k] = d[k]; });
    await apply(extra);
  });
}

function restoreFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let b; try { b = JSON.parse(reader.result); } catch (e) { toast("That file isn't a Partnership Desk backup."); return; }
    if (!b || !Array.isArray(b.companies) || !Array.isArray(b.opps) || !Array.isArray(b.interactions)) { toast("That file isn't a Partnership Desk backup."); return; }
    modal("Restore from backup", `<p style="margin:0">Backup from <b>${esc(fmtY((b.exportedOn || "").slice(0, 10)))}</b>: ${b.companies.length} companies, ${b.opps.length} deals, ${b.interactions.length} contact log entries and ${(b.events || []).length} events.</p>
      <p class="muted small" style="margin:0">Everything in the file is written back. Items that still exist are overwritten with the backup version; nothing else is deleted.</p>`, async () => {
      for (const c of b.companies) { if (c && c.id) await put("companies", c.id, bodyOf(c)); }
      for (const o of b.opps) { if (o && o.id) await put("opps", o.id, bodyOf(o)); }
      for (const i of b.interactions) { if (i && i.id) await put("interactions", i.id, bodyOf(i)); }
      for (const ev of (b.events || [])) { if (ev && ev.id) await put("events", ev.id, bodyOf(ev)); }
      if (b.settings) {
        await put("config", "settings", { semester: b.settings.semester || CFG.semester, packages: b.settings.packages || [], themes: b.settings.themes || [] });
        await put("config", "team", { members: b.settings.team || [] });
      }
      toast("Backup restored.");
    }, { save: "Restore" });
  };
  reader.readAsText(file);
}

function parseList(text) {
  const seen = new Set(S.companies.map(c => c.name.toLowerCase())), all = [], fresh = []; let skipped = 0;
  String(text || "").split(/\r?\n/).forEach(line => {
    const parts = (line.includes("\t") ? line.split("\t") : line.split(";")).map(x => x.trim());
    const name = (parts[0] || "").replace(/^["']|["']$/g, ""); if (!name) return;
    const ind = INDUSTRIES.find(i => i.toLowerCase() === (parts[1] || "").toLowerCase()) || "Other";
    const size = SIZES.find(s => s === (parts[2] || "").replace(/\s/g, "")) || "Unknown";
    const row = { name, industry: ind, size, website: parts[3] || "" }; all.push(row);
    if (seen.has(name.toLowerCase())) { skipped++; return; }
    seen.add(name.toLowerCase()); fresh.push(row);
  });
  return { all, fresh, skipped };
}

const ASSISTANT_RULES = `You are the assistant inside the CBS Talks Partnership Desk, the partnership system of CBS Talks, a student organisation at Copenhagen Business School that runs talks with business leaders. You help the Partnerships Manager decide which companies to work on, keep the records up to date and prepare outreach.

How the desk works:
- Two scores only. Fit (0-10) = F1 Student pull + F2 Content fit + F3 Reason to work with CBS Talks + F4 Track record + F5 Long-term potential, each 0-2. F4 is derived from commercial evidence, never rated by hand. Fit is incomplete until all five exist.
- Access (0-4) is calculated, never typed: 4 champion contact or satisfied past partner, 3 positive interaction with a current contact within a year, 2 an introduction path, 1 a named contact in a suitable role, 0 none.
- Quadrants: Priority (Fit 6+ and Access 2+), Build a Path (Fit 6+, Access below 2, at most 5 paths at a time), Quick Win (Fit below 6, Access 2+, only for a specific current need), Low Priority, Research (Fit incomplete), Do not contact.
- Work queue order: renewals, overdue, no reply, due this week, missing next action, priority prospects without a deal, paths in progress, quick wins, path candidates.
- No cash ask in a first contact unless Access is 3 or more.

Rules you must follow:
- Never invent facts about companies or people. If something is not in the data, in what the user told you or in a source you found, say it is unknown and suggest what to check.
- No budget estimates: never guess what a company could or would pay. Only amounts CBS Talks actually received or agreed are recorded.
- Guesses become questions: never present a company's likely goals or objections as fact; turn them into questions to ask them.
- Contacts: work data only (a published work email or LinkedIn profile), no guessed emails, no personal opinions about people.
- Change data only when the user asks you to, using the tools, and only with information the user gave you or that is already in the desk. Never rate Fit from your own judgement: you may suggest a rating in your reply, but write it only when the user states or confirms it. A rating of 2 needs a source.
- Evidence you add is stored as an AI draft that a person must verify.
- If a request is ambiguous (which company, which deal), ask before changing anything.
- Every change is shown to the user for a Yes/No approval before it is saved. If they say no, don't make it again unless they ask. After changing data, say briefly what you changed.

Style: answer in the user's language (English unless they write another language), short and practical. Plain text with short paragraphs and "- " bullet lists; no tables, no headings, no bold markers. Use company and contact names exactly as in the data.`;

  L.push(`Team: ${CFG.team.map(t => t.name + (t.active === false ? " (left)" : "")).join(", ") || "none"}. The user is: ${me() || "unknown"}.`);
  L.push(`Packages: ${CFG.packages.map(p => `${p.name} ${p.price} DKK`).join(", ") || "none set"}.`);
  L.push(`Themes: ${CFG.themes.filter(t => t.active !== false).map(t => t.name).join(", ") || "none set"}.`);
  const evs = [...S.events].sort((a, b) => (b.date || "").localeCompare(a.date || "")).slice(0, 12);
  L.push("", "RECENT EVENTS:", ...(evs.length ? evs.map(e => `- ${e.date} ${e.title}${e.theme ? " (theme: " + e.theme + ")" : ""}${e.attendance ? ", " + e.attendance + " attended" : ""}${e.studyLines ? ", study lines: " + e.studyLines : ""}${(e.partners || []).length ? ", partners: " + e.partners.map(id => (co(id) || {}).name).filter(Boolean).join(", ") : ""}${e.reportSent ? ", partner report sent " + e.reportSent : ""}`) : ["- none recorded"]));
  L.push("", "WORK QUEUE:");
  q.renewals.forEach(x => L.push(`- Renewal due: ${co(x.o.co).name}, renewal date ${x.o.renewalDate}, satisfaction ${x.o.satisfaction || "Unknown"}`));
  q.follow.forEach(x => L.push(`- ${x.flag}: ${co(x.o.co).name} (${x.o.type}, ${x.o.stage}), next action: ${x.o.next || "none"}, due ${x.o.due || "none"}, owner ${x.o.owner || "none"}`));
  q.prio.forEach(c => L.push(`- Priority prospect without a deal: ${c.name}. Suggested first step: ${suggestion(c)}`));
  q.paths.forEach(c => L.push(`- Path in progress since ${c.path.started}: ${c.name}: ${c.path.action}`));
  q.cands.forEach(c => L.push(`- Path candidate: ${c.name}`));
  q.quick.forEach(c => L.push(`- Quick win for a need: ${c.name}: ${c.need}`));
  if (L[L.length - 1] === "WORK QUEUE:") L.push("- nothing");
  L.push("", "COMPANIES (name | quadrant | Fit total (F1/F2/F3/F4/F5) | Access | owner | last contact | open deals | notes):");
  S.companies.forEach(c => {
    const f = c.fit, a = access(c);
    const open = oppsOf(c.id).filter(isOpen).map(o => `${o.type} ${o.stage}`).join(", ") || "none";
    const notes = [c.need && "need: " + c.need, c.path && "path: " + c.path.action, c.intro && "intro: " + c.intro, checks(c).length && "checks: " + checks(c).join(", ")].filter(Boolean).join("; ");
    L.push(`- ${c.name} | ${quadrant(c)} | Fit ${fit(c) ?? "incomplete"} (${[f.f1[0], f.f2[0], f.f3[0], f4(c), f.f5[0]].map(v => v ?? "?").join("/")}) | Access ${a.level} ${ACCESS_NAMES[a.level]} | owner ${c.owner || "none"} | last contact ${lastContact(c.id) || "never"} | open deals: ${open}${notes ? " | " + notes : ""}`);
  });
  if (!S.companies.length) L.push("- no companies yet");
  let s = L.join("\n");
  if (s.length > 60000) s = s.slice(0, 60000) + "\n... (list cut short: use get_company for details)";
  return s;
}

/* tool helpers */
const str = v => v == null ? "" : String(v).trim();
const oneOf = (v, list, label) => { const s = str(v); if (!s) return ""; const hit = list.find(x => x.toLowerCase() === s.toLowerCase()); if (!hit) throw new Error(`${label} must be one of: ${list.join(", ")}`); return hit; };
const isoDate = (v, label) => { const s = str(v); if (!s) return ""; if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) throw new Error(`${label} must be a date as yyyy-mm-dd`); return s; };
function findCompany(name) {
  const n = str(name).toLowerCase(); if (!n) throw new Error("Say which company.");
  const exact = S.companies.filter(c => c.name.toLowerCase() === n); if (exact.length === 1) return exact[0];
  const part = S.companies.filter(c => c.name.toLowerCase().includes(n) || n.includes(c.name.toLowerCase().replace(/ \(example\)$/, "")));
  if (part.length === 1) return part[0];
  if (!part.length) throw new Error(`No company called "${name}" in the desk.`);
  throw new Error(`Several companies match "${name}": ${part.map(c => c.name).join(", ")}. Ask the user which one.`);
}
function findDeal(c, type, openOnly) {

async function applyStage(o, stage, extra) {

}

/* every change the assistant wants to make waits for the user's Yes or No */
const APPROVALS = [];
const CHANGE_TITLES = { add_company: "Add a company", update_company: "Change a company", rate_fit: "Set a Fit rating", add_contact: "Add a contact",
  add_evidence: "Add evidence (stored as an unchecked AI draft)", add_commercial_evidence: "Add commercial evidence", create_deal: "Create a deal", update_deal: "Update a deal", log_contact: "Log a contact" };
function askApproval(tool, input, signal) {
  return new Promise((resolve, reject) => {
    const item = { id: rid(), title: CHANGE_TITLES[tool] || tool,
      lines: Object.entries(input || {}).filter(([, v]) => v !== "" && v != null).map(([k, v]) => [k.replace(/_/g, " "), typeof v === "object" ? JSON.stringify(v) : String(v)]) };
    const done = () => { const i = APPROVALS.indexOf(item); if (i >= 0) APPROVALS.splice(i, 1); schedule(); };
    item.yes = () => { done(); resolve(); };
    item.no = () => { done(); reject(new Error("The user said no to this change. Don't make it unless they ask again.")); };
    signal.addEventListener("abort", () => { if (APPROVALS.includes(item)) { done(); reject(new Error("The user didn't answer in time, so nothing was changed.")); } });
    APPROVALS.push(item);
    const m = CHAT.msgs[CHAT.msgs.length - 1]; if (m && m.role === "ai") m.status = "Waiting for your approval…";
    schedule();
  });
}

function chatErr(e) {
  const c = e && e.code;
  if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(c)) {
    CHAT.off = c === "not_granted" ? "You haven't allowed this page to use Claude. Reload the page and choose Allow to use the assistant." : "The assistant isn't available for your account right now.";
    return "";
  }
  if (c === "tools_unavailable") { CHAT.noTools = true; return "This view can't let the assistant change data. Send your message again: it can still answer questions."; }
  if (c === "rate_limited") return "You've reached a usage limit for now. Try again later.";
  if (c === "session_expired") return "Your claude.ai session expired. Sign in again and reload the page.";
  if (c === "prompt_too_large") return "That was too much at once. Clear the chat or ask about fewer companies.";
  if (c === "refused") return "Claude declined that request. Try rephrasing it.";
  if (c === "cancelled") return "Stopped.";
  return "Something went wrong. Try again.";
}

    ready: `<button class="switch" role="switch" aria-checked="${WEB.enabled}" data-chat="webtoggle"><span class="knob" aria-hidden="true"></span>Web search ${WEB.enabled ? "on" : "off"}</button>
      <span class="muted small">${WEB.enabled ? `The assistant can search the web through ${WEB_SERVER}, an outside service. Don't paste contact details into questions you want searched.` : "The assistant only uses the desk's data and what you tell it."}</span>`,
    allow: `<span class="pill info">Web search off</span><button class="btn small" data-chat="web">Turn on web search</button>`,
    denied: `<span class="pill info">Web search off</span><span class="muted small">You declined ${WEB_SERVER} for this page. Turn it on again from this page's Permissions menu, then reload.</span>`,
    missing: `<span class="pill info">Web search off</span><span class="muted small">To search the web, add the free <b>${WEB_SERVER}</b> connector in claude.ai (Settings → Connectors), then reload this page.</span>`,
    unsupported: `<span class="pill info">Web search unavailable</span><span class="muted small">Web search can't run in this view.</span>`,
    off: "",
  }[WEB.state] || "";
  return `<div class="rowbtns webbar">${claudeSw}${m}</div>`;
}

async function chatSend(textIn) {
  const text = str(textIn ?? CHAT.draft);
  if (!text || CHAT.busy || !SAMPLE || !AI.enabled) return;
  CHAT.draft = ""; CHAT.busy = true;
  CHAT.msgs.push({ role: "user", text });
  const ai = { role: "ai", text: "", acts: [], status: "Thinking…" };
  CHAT.msgs.push(ai);
  const webOn = WEB.state === "ready" && WEB.enabled && !CHAT.noTools;
  const turns = [{ role: "user", content: ASSISTANT_RULES + (webOn ? WEB_RULES_ON : WEB_RULES_OFF) + "\n\nCURRENT DESK DATA:\n" + deskSnapshot() }];
  CHAT.msgs.slice(-21, -1).forEach(m => { if (m.text && !(m.role === "ai" && m.failed)) turns.push({ role: m.role === "user" ? "user" : "assistant", content: m.text }); });
  while (turns.length > 1 && turns[1].role === "assistant") turns.splice(1, 1);
  const ctl = CHAT.ctl = new AbortController();
  let tools = CHAT.noTools ? [] : [AGENT_TOOLS[0], ...(webOn ? WEB.tools : []), ...AGENT_TOOLS.slice(1).filter(t => !t.write || canWrite)];
  if (SAMPLE_TOOLS_MAX && tools.length > SAMPLE_TOOLS_MAX) tools = tools.slice(0, SAMPLE_TOOLS_MAX);
  const wrapped = tools.map(t => ({ name: t.name, description: t.description, inputSchema: t.inputSchema,
    execute: async (input, ctx) => { ai.status = t.web ? (t.name === "web_search" ? "Searching the web…" : "Reading a web page…") : t.write ? "Updating the desk…" : "Reading the desk…"; schedule();
      if (ctx.signal.aborted) throw new Error("Stopped");
      if (t.web) { try { return await t.execute(input || {}, ctx.signal); } catch (e) { throw new Error("Web search failed" + (e && e.code ? " (" + e.code + ")" : "") + ". Try again later."); } }
      const call = { approved: false, approve: async () => { if (call.approved) return; await askApproval(t.name, input, ctx.signal); call.approved = true;
        const m = CHAT.msgs[CHAT.msgs.length - 1]; if (m && m.role === "ai") m.status = "Updating the desk…"; schedule(); } };
      return await t.execute(input || {}, call); } }));
  render(); scrollChat();
  try {
    const opts = { signal: ctl.signal, onText: ({ text }) => { ai.text = text; ai.status = ""; paintMsg(CHAT.msgs.length - 1); } };
    if (wrapped.length && SAMPLE_TOOLS_MAX) opts.tools = wrapped; else opts.cache = false;
    const r = await SAMPLE(turns, opts);
    ai.text = r.text; ai.status = r.truncated ? "The answer was cut short. Ask for less at a time." : "";
  } catch (e) {
    ai.text = (e && e.text) || ai.text || ""; const m = chatErr(e); ai.status = m; if (!ai.text) ai.failed = true;
  } finally { CHAT.busy = false; CHAT.ctl = null; render(); }
}
function paintMsg(idx) {
  const m = CHAT.msgs[idx], el = document.getElementById("msg-text-" + idx); if (!el) return;
  el.textContent = m.text; const st = document.getElementById("msg-status-" + idx); if (st) { st.textContent = m.status || ""; st.hidden = !m.status; }
}
function scrollChat() { const c = document.getElementById("chat-input"); if (c) c.scrollIntoView({ block: "nearest" }); }

function viewAssistant() {
  if (CHAT.off || !SAMPLE) return `<div class="view-head"><div><h2>Assistant</h2></div></div>
    <section class="card notice"><p>${esc(CHAT.off || (conn === "connecting" ? "Starting the assistant…" : "The assistant only works when this page is opened in claude.ai."))}</p></section>`;
  const msgs = CHAT.msgs.map((m, i) => m.role === "user"
    ? `<div class="msg user">${esc(m.text)}</div>`
    : `<div class="msg ai"><div class="mt" id="msg-text-${i}">${esc(m.text)}</div>
        <div class="msg-status" id="msg-status-${i}" ${m.status ? "" : "hidden"}>${esc(m.status || "")}</div>
        ${m.acts.length ? `<ul class="acts">${m.acts.map(a => `<li>✓ ${esc(a)}</li>`).join("")}</ul>` : ""}</div>`).join("");
  return `
  <div class="view-head"><div><h2>Assistant</h2><p>Ask about your companies and deals, find new companies or speakers, prepare outreach, or tell it what happened and it updates the desk. Facts from the web come with their source.</p></div>
  ${CHAT.msgs.length ? `<button class="btn" data-chat="clear" ${CHAT.busy ? "disabled" : ""}>New chat</button>` : ""}</div>
  ${webBar()}
  <div class="chat">
    ${msgs ? msgs + APPROVALS.map(a => `<div class="card approve" role="group" aria-label="Approve change">
        <b>Approve this change?</b><span>${esc(a.title)}</span>
        <dl class="kv">${a.lines.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
        <div class="rowbtns"><button class="btn primary small" data-chat="yes" data-id="${a.id}">Yes, make this change</button><button class="btn small" data-chat="no" data-id="${a.id}">No</button></div></div>`).join("") : ""}
    ${msgs ? "" : `<section class="card empty-hero"><h3>What can I help with?</h3>
      <p>For example: "Add Nordlys Logistics, logistics, 250–999 employees, owner J.H." or "I emailed Sofie at ProServ today about renewing, follow up next Friday."</p>
      <div class="chips">${PROMPTS.map(p => `<button class="chip" data-chat="prompt" data-text="${esc(p)}" ${AI.enabled ? "" : "disabled"}>${esc(p)}</button>`).join("")}</div></section>`}
    <div class="composer">
      <textarea id="chat-input" rows="3" ${AI.enabled ? "" : "disabled"} placeholder="${AI.enabled ? "Ask or tell the assistant something… (Enter to send, Shift+Enter for a new line)" : "Claude is off. Switch it on above to use the assistant."}" aria-label="Message to the assistant">${esc(CHAT.draft)}</textarea>
      <div class="rowbtns">${CHAT.busy ? `<button class="btn" data-chat="stop">Stop</button><span class="muted small">Working…</span>` : `<button class="btn primary" data-chat="send" ${AI.enabled ? "" : "disabled"}>Send</button>`}
        <span class="muted small">${canWrite ? "Changes it makes are listed under its answer." : "Read only: it can answer but not change data."} Uses your claude.ai account.</span></div>
    </div>
  </div>`;
}

/* ---------- toast (with Undo for the last change) ---------- */
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast"), canUndo = !!(TX && TX.prev.size);
  t.innerHTML = `<span>${esc(msg)}</span>${canUndo ? `<button data-undo>Undo</button>` : ""}`; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, canUndo ? 7000 : 3600);
}
function hideToast() { const t = document.getElementById("toast"); if (t) t.hidden = true; }

/* ---------- events ---------- */
const needWrite = () => { if (canWrite && DB) return true; toast(DB ? "You have view access only." : "Not connected. Open the desk in claude.ai."); return false; };
const ACTIONS = {
  addco: () => companyModal(null),
  paste: () => pasteModal(),
  editco: () => companyModal(co(openCompany)),
  delco: () => { const c = co(openCompany); act(() => deleteCompany(c), `${c.name} deleted.`); },
  rate: el => rateModal(co(openCompany), el.dataset.k, Number(el.dataset.val)),
  addce: () => ceModal(co(openCompany)),
  delce: el => { const c = co(openCompany); act(() => patch("companies", c.id, { commercial: clone(c.commercial).filter(x => x.k !== el.dataset.k) }), "Removed."); },
  addcontact: () => contactModal(co(openCompany)),
  editcontact: el => { const c = co(openCompany); contactModal(c, c.contacts.find(p => p.k === el.dataset.k)); },
  addev: () => evModal(co(openCompany)),
  checkev: el => { const c = co(openCompany); act(() => patch("companies", c.id, { evidence: clone(c.evidence).map(x => x.k === el.dataset.k ? { ...x, checked: true, checkedBy: me(), checkedOn: todayIso() } : x) }), "Marked as checked."); },
  delev: el => { const c = co(openCompany); act(() => patch("companies", c.id, { evidence: clone(c.evidence).filter(x => x.k !== el.dataset.k) }), "Removed."); },
  newdeal: el => dealModal(el.dataset.co),
  editdeal: el => editDealModal(S.opps.find(o => o.id === el.dataset.opp)),
  deldeal: el => act(() => del("opps", el.dataset.opp), "Deal deleted."),
  renew: el => { const o = S.opps.find(x => x.id === el.dataset.opp);
    dealModal(o.co, { renewal: true, type: o.type, kind: o.kind, owner: o.owner, contact: o.contact, next: "Propose the renewal", due: D(7) }); },
  log: el => logModal({ oppId: el.dataset.opp, coId: el.dataset.co }),
  addevent: () => eventModal(null),
  delevent: el => { closeModal(false); act(() => del("events", el.dataset.id), "Event deleted."); },
  addtheme: () => themeModal(),
  toggletheme: el => { const t = clone(CFG.themes); const m = t[Number(el.dataset.i)]; m.active = m.active === false; act(() => saveSettings({ ...CFG, themes: t }), m.active ? "Theme active." : "Theme retired."); },
  editsem: () => semModal(),
  addteam: () => teamModal(),
  toggleteam: el => { const t = clone(CFG.team); const m = t[Number(el.dataset.i)]; m.active = m.active === false; act(() => saveTeam(t), m.active ? `${m.name} is active.` : `${m.name} marked as left.`); },
  addpkg: () => pkgModal(),
  delpkg: el => act(() => saveSettings({ ...CFG, packages: clone(CFG.packages).filter((_, i) => i !== Number(el.dataset.i)) }), "Package removed."),
  loadex: () => act(loadExamples),
  delex: () => act(removeExamples),
};
const NO_WRITE = {
  backup: () => backup(),
  report: () => { const c = co(openCompany); askAssistant(`Draft a partner report for ${c.name}: what we did together (deals, events, attendance and study lines), what worked, and a proposal for next year. Use only data in the desk; mark anything missing as a question for me.`); },
};
document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest("[data-undo]")) { performUndo(); return; }
  if (t.closest("#qs-open")) { openQs(); return; }
  if (t.closest("[data-qsclose]")) { closeQs(); return; }
  const qi = t.closest("[data-qs]"); if (qi) { runQs(Number(qi.dataset.qs)); return; }
  const tab = t.closest("[data-tab]"); if (tab) { current = tab.dataset.tab; try { localStorage.setItem("cbs-desk-tab", current); } catch (x) {} closeModal(false); closeDrawer(); render(); window.scrollTo(0, 0); return; }
  if (t.closest("[data-close]")) { closeDrawer(); return; }
  const dt = t.closest("[data-dtab]"); if (dt) { drawerTab = dt.dataset.dtab; renderDrawer(false); const d = document.querySelector(".drawer"); if (d) d.scrollTop = 0; return; }
  const cv = t.closest("[data-coview]"); if (cv) { companyView = cv.dataset.coview; try { localStorage.setItem("cbs-desk-coview", companyView); } catch (x) {} render(); return; }
  const ch = t.closest("[data-chat]");
  if (ch) { const k = ch.dataset.chat;
    if (k === "send") chatSend(); else if (k === "prompt") { CHAT.draft = ch.dataset.text.endsWith("…") ? ch.dataset.text.slice(0, -1) + " " : ""; if (CHAT.draft) { render(); const i = document.getElementById("chat-input"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); } else chatSend(ch.dataset.text); }
    else if (k === "stop" && CHAT.ctl) CHAT.ctl.abort(); else if (k === "yes" || k === "no") { const a = APPROVALS.find(x => x.id === ch.dataset.id); if (a) a[k](); } else if (k === "web") { setWebEnabled(true); WEB.state = "off"; render(); loadWebTools(true); }
    else if (k === "aitoggle") { setAiEnabled(!AI.enabled); if (!AI.enabled && CHAT.ctl) CHAT.ctl.abort(); render(); toast(AI.enabled ? "Claude on." : "Claude off: the assistant won't send anything."); }
    else if (k === "webtoggle") { setWebEnabled(!WEB.enabled); render(); toast(WEB.enabled ? "Web search on." : "Web search off."); } else if (k === "clear" && !CHAT.busy) { CHAT.msgs = []; render(); }
    return; }
  const a = t.closest("[data-act]");
  if (a) {
    if (NO_WRITE[a.dataset.act]) { NO_WRITE[a.dataset.act](a); return; }
    if (!needWrite()) return;
    if (a.hasAttribute("data-confirm") && !a.dataset.armed) {
      a.dataset.armed = "1"; a.dataset.label = a.textContent; a.textContent = "Click again to confirm";
      setTimeout(() => { if (a.isConnected && a.dataset.armed) { delete a.dataset.armed; a.textContent = a.dataset.label; } }, 4000);
      return;
    }
    const fn = ACTIONS[a.dataset.act]; if (fn) fn(a); return;
  }
  const fl = t.closest("[data-filter]"); if (fl) { companyFilter = fl.dataset.filter; render(); return; }
  const ev = t.closest("[data-event]"); if (ev) { const x = S.events.find(y => y.id === ev.dataset.event); if (x && needWrite()) eventModal(x); return; }
  const op = t.closest("[data-open]"); if (op) { if (QS.open) closeQs(); openDrawer(op.dataset.open); return; }
});
document.addEventListener("change", e => {
  const m = e.target.closest("[data-move]"); if (m) { if (needWrite()) moveStage(m.dataset.move, m.value); else render(); return; }
  if (e.target.id === "restore-file") { const f = e.target.files && e.target.files[0]; e.target.value = ""; if (f && needWrite()) restoreFile(f); return; }
  if (e.target.id === "me-select") { setMe(e.target.value); toast(e.target.value ? `Hi ${e.target.value}.` : "Cleared."); }
});
document.addEventListener("input", e => {
  if (e.target.id === "search") { companySearch = e.target.value; render(); }
  if (e.target.id === "chat-input") CHAT.draft = e.target.value;
  if (e.target.id === "qs-input") { QS.q = e.target.value; QS.sel = 0; paintQs(); }
});
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); if (QS.open) closeQs(); else if (!document.getElementById("modal")) openQs(); return; }
  if (QS.open) {
    if (e.key === "Escape") { closeQs(); return; }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); const n = qsItems().length; if (n) { QS.sel = (QS.sel + (e.key === "ArrowDown" ? 1 : n - 1)) % n; paintQs(); } return; }
    if (e.key === "Enter" && e.target.id === "qs-input") { e.preventDefault(); runQs(QS.sel); return; }
  }
  if (e.key === "Escape") { if (document.getElementById("modal")) { closeModal(true); return; } if (openCompany) closeDrawer(); }
  if (e.key === "Enter" && !e.shiftKey && e.target.id === "chat-input" && !e.isComposing) { e.preventDefault(); chatSend(); return; }
  if (e.key === "Enter" && e.target.matches("tr[data-open], g[data-open]")) { openDrawer(e.target.dataset.open); }
  if (e.key === "Enter" && e.target.matches("tr[data-event]")) { const x = S.events.find(y => y.id === e.target.dataset.event); if (x && needWrite()) eventModal(x); }
});
/* drag a deal card to another stage */
let dragId = null;
document.addEventListener("dragstart", e => { const d = e.target.closest && e.target.closest("[data-drag]"); if (!d) return; dragId = d.dataset.drag; d.classList.add("dragging"); try { e.dataTransfer.setData("text/plain", dragId); e.dataTransfer.effectAllowed = "move"; } catch (x) {} });
document.addEventListener("dragend", e => { dragId = null; document.querySelectorAll(".dragging, .drop-hover").forEach(x => x.classList.remove("dragging", "drop-hover")); });
document.addEventListener("dragover", e => { const c = e.target.closest && e.target.closest("[data-drop]"); if (!c || !dragId) return; e.preventDefault(); document.querySelectorAll(".drop-hover").forEach(x => x !== c && x.classList.remove("drop-hover")); c.classList.add("drop-hover"); });
document.addEventListener("drop", e => {
  const c = e.target.closest && e.target.closest("[data-drop]"); if (!c || !dragId) return; e.preventDefault();
  const o = S.opps.find(x => x.id === dragId); c.classList.remove("drop-hover"); dragId = null;
  if (o && o.stage !== c.dataset.drop && needWrite()) moveStage(o.id, c.dataset.drop);
});
/* chart tooltip */
function showTip(g) {
  const wrap = document.getElementById("chart"), tip = document.getElementById("tip"); if (!wrap || !tip || !g) return;
  const [name, rest] = g.dataset.tip.split("|"), dot = g.querySelector(".dot").getBoundingClientRect(), w = wrap.getBoundingClientRect();
  tip.innerHTML = `<b>${name}</b><br>${rest}`; tip.style.left = (dot.left + dot.width / 2 - w.left + wrap.scrollLeft) + "px"; tip.style.top = (dot.top - w.top) + "px"; tip.hidden = false;
}
document.addEventListener("mouseover", e => { const g = e.target.closest && e.target.closest("g.pt"); if (g) showTip(g); else { const t = document.getElementById("tip"); if (t && !t.hidden && !(e.target.closest && e.target.closest("#chart"))) t.hidden = true; } });
document.addEventListener("mouseout", e => { const g = e.target.closest && e.target.closest("g.pt"); if (g && !(e.relatedTarget && g.contains(e.relatedTarget))) { const t = document.getElementById("tip"); if (t) t.hidden = true; } });
document.addEventListener("focusin", e => { const g = e.target.closest && e.target.closest("g.pt"); if (g) showTip(g); });
document.addEventListener("focusout", e => { const g = e.target.closest && e.target.closest("g.pt"); if (g) { const t = document.getElementById("tip"); if (t) t.hidden = true; } });

/* ---------- connect to the shared database ---------- */
function subscribe(col, fn) {
  DB.collection(col).onSnapshot(s => { RAW[col] = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); fn(s); snapVer[col]++; schedule(); }, () => { conn = "error"; schedule(); });
}
async function init() {
  render();
  const C = window.claude;
  if (!C || typeof C.use !== "function") { conn = "offline"; render(); return; }
  const [db, user, dl, sm, mcp, perms] = await Promise.all([C.use("db"), C.use("user"), C.use("downloads"), C.use("sample"), C.use("mcp"), C.use("permissions")]);
  DL = dl; SAMPLE = sm; MCP = mcp; PERMS = perms; initWeb().then(schedule);
  if (SAMPLE) { try { const lim = await SAMPLE.limits(); SAMPLE_TOOLS_MAX = (lim && lim.tools && lim.tools.maxCount) || 0; } catch (e) {} if (!SAMPLE_TOOLS_MAX) CHAT.noTools = true; }
  if (!db) { conn = "offline"; render(); return; }
  DB = db;
  let w = null; try { w = user ? await user.can("data.write") : null; } catch (e) {}
  canWrite = w !== false; conn = "live";
  subscribe("companies", s => { S.companies = s.docs.map(d => normCompany(d.id, d.data())); loaded.companies = true; });
  subscribe("opps", s => { S.opps = s.docs.map(d => ({ ...d.data(), id: d.id })); loaded.opps = true; });
  subscribe("interactions", s => { S.interactions = s.docs.map(d => ({ ...d.data(), id: d.id })); loaded.interactions = true; });
  subscribe("events", s => { S.events = s.docs.map(d => ({ ...d.data(), id: d.id })); loaded.events = true; });
  subscribe("config", s => {
    const get = id => { const d = s.docs.find(x => x.id === id); return (d && d.data()) || {}; };
    const st = get("settings"), tm = get("team");
    CFG = { semester: { name: "", start: "", end: "", target: 0, ...(st.semester || {}) }, packages: st.packages || [], team: tm.members || [], themes: st.themes || [] };
    loaded.config = true;
  });
  render();
}
init();
</script>
